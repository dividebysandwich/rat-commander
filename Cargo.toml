[package]
name = "rat-commander"
version = "1.9.9"
edition = "2024"
description = "A self-contained Norton/Midnight-Commander-style TUI file manager"
license = "GPL-2.0-only"
repository = "https://github.com/dividebysandwich/rat-commander"

# The installed executable is named `rc` for convenience.
[[bin]]
name = "rc"
path = "src/main.rs"

# cargo-deb packaging metadata (binary is auto-included from [[bin]]).
[package.metadata.deb]
maintainer = "rat-commander maintainers"
copyright = "rat-commander contributors"
section = "utils"
priority = "optional"
# postinst/postrm create and remove the `rcedit` shim (`/usr/bin/rcedit` → `rc`),
# which starts the program in the editor.
maintainer-scripts = "packaging/debian"
# Explicit dependencies (skips dpkg-shlibdeps, which cannot analyse the
# cross-compiled arm64/armhf binaries on an x86_64 CI host). These shared
# libraries ship by default on Debian and Raspberry Pi OS. `libasound2` is the
# ALSA library audio playback links against; Debian 13 and Ubuntu 24.04 ship it
# as `libasound2t64`, which provides the old name on 64-bit architectures (on
# 32-bit ones it is a different ABI — see the `noaudio` variant below).
depends = "libc6, libgcc-s1, libstdc++6, liblzma5, libasound2"
extended-description = """
rat-commander is a self-contained, Midnight-Commander-style two-panel file
manager for the terminal: internal viewer/editor, archives browsed as
directories, FTP/SFTP/SCP remote panels, themeable truecolor UI, and a
configurable F2 user menu."""
assets = [
    ["target/release/rc", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rat-commander/README.md", "644"],
    # Shell wrappers for `rc --print-last-dir` ("cd to where I quit"). A shell
    # function can't be a symlink, so unlike the `rcedit` shim these are sourced
    # by the user rather than installed onto PATH.
    ["packaging/shell/rc.sh", "usr/share/rat-commander/rc.sh", "644"],
    ["packaging/shell/rc.fish", "usr/share/rat-commander/rc.fish", "644"],
]

# The package for a build without audio playback (the Raspberry Pi 32-bit one —
# see release.yml): the same package, minus the ALSA dependency.
# `cargo deb --variant=noaudio`.
[package.metadata.deb.variants.noaudio]
name = "rat-commander"
depends = "libc6, libgcc-s1, libstdc++6, liblzma5"

[features]
default = ["rar", "sqlite", "audio"]
# RAR read/extract support (pulls in the C++ `unrar` library). Disable it
# (`--no-default-features`) where a C++ toolchain is unavailable or too old —
# e.g. the Raspberry Pi cross-compile images.
rar = ["dep:unrar"]
# Browse a SQLite database as a directory (tables as folders, rows as files).
# Pulls in the bundled C SQLite, so disable it alongside `rar` where a C
# toolchain is unavailable — the Raspberry Pi cross-compile images do both.
sqlite = ["dep:rusqlite"]
# Audio playback in the viewer's and the Details view's audio view (rodio over
# cpal). On Linux cpal links the system ALSA library, so building needs
# `libasound2-dev` (the Raspberry Pi cross images install it through
# Cross.toml). Without it the spectrogram and waveform are still drawn — the
# decoding is pure Rust — but nothing can be played.
audio = ["dep:rodio"]

[dependencies]
async-trait = "0.1.92"
bzip2 = "0.6.1"
# File checksumming (File → Checksum). `digest` provides the common streaming
# trait shared by the RustCrypto hashers (`sha1`/`sha2`); `crc32fast` and `md5`
# bring their own. All are already in the tree via other dependencies.
crc32fast = "1.5.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
digest = "0.11.3"
directories = "6.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
globset = "0.4.20"
md5 = "0.8.1"
memchr = "2.8.3"
# Filesystem change notification, so a panel refreshes itself when something
# else writes into the directory it is showing. Pure Rust on Linux (inotify) and
# Windows (ReadDirectoryChangesW); macOS goes through FSEvents, which only
# matters for native macOS builds, so the ARM cross-compiles stay unaffected.
notify = "8.2.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
# 010 Editor template regexes (FindAll, RegExMatch) use lookbehind, which
# `regex` lacks. Already compiled as part of the tree (syntect), so no new crate.
fancy-regex = "0.16.2"
ropey = "1.6.1"
russh = "0.63.3"
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = "0.22.2"
sha1 = "0.11.0"
sha2 = "0.11.0"
# Syntax highlighting. Pure-Rust regex backend (no C `onig`) keeps the ARM
# cross-compile builds working; bundles Sublime syntaxes + themes, and more
# `.sublime-syntax`/theme files can be loaded later to extend it.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
suppaftp = { version = "12.0.0", default-features = false, features = ["tokio", "tokio-rustls-aws-lc-rs"] }
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.5"
# Browsing a JSON document as a directory. Already compiled as part of the tree
# (syntect depends on it), so naming it here adds no crate and no build time.
serde_json = "1.0"
unicode-width = "0.2.2"
unrar = { version = "0.5.8", optional = true }
# Read-only SQLite browsing. `bundled` compiles SQLite itself rather than
# linking the system library, which is what keeps the binary self-contained and
# the .deb free of a libsqlite3 dependency.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
# Headless terminal emulator for the command-line console backdrop: parses the
# ANSI/VT stream captured from commands into a screen grid we render behind the
# panels (Norton-Commander style).
vt100 = "0.16.2"
walkdir = "2.5.0"
xz2 = "0.1.7"
zip = "8.6.0"
# Zstandard: `.tar.zst`, `.pkg.tar.zst`, and the payload of a modern .deb/.rpm.
# Already compiled as part of this tree — `zip`'s default features pull the very
# same crate in — so naming it here costs no extra crate and no extra build time,
# on the ARM cross targets as much as anywhere.
zstd = { version = "0.13.3", default-features = false }
# Cross-platform process/CPU/memory/disk/network sampling for the process
# explorer (Linux, Windows, macOS). Pure Rust, no external C deps. Only the
# `system` + `network` + `user` features are needed (drops temperature/components
# and the mounted-disk listing we don't use). `user` maps process UIDs to names.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "user"] }
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
# Pure-Rust image decoders for the Details-view thumbnail preview (no C deps, so
# the ARM cross-compile keeps working). RgbaImage construction for the terminal-
# graphics rasters needs no features; these add the common decode formats.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# SVG for the image viewer, the thumbnails and the Details preview: usvg parses,
# tiny-skia rasterizes. Pure Rust (no C, cross-compile OK). `svgz` is left out
# because we inflate `.svgz` ourselves, with a cap, through the flate2 above.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# The viewer's document view. Spreadsheets (.xlsx/.xlsm/.xlsb/.xls/.ods) are
# read by calamine into the table view; pure Rust, and it shares the zip and
# quick-xml already above, so it brings little of its own. Word, PowerPoint,
# OpenDocument text and EPUB need no crate beyond those two.
calamine = { version = "0.36.1", default-features = false }
# PDF text for the document view: lopdf underneath, plus the font decoding that
# turns glyph codes back into text. Pure Rust (no poppler, no pdfium).
pdf-extract = "0.12.1"
# Pure-Rust EXIF parser, used to pull a JPEG's embedded thumbnail for the Details
# preview so we don't decode a full-resolution photo just to shrink it.
kamadak-exif = "0.6.1"
# "Send file over LAN": a pure-Rust QR encoder for the download URL, plus network
# interface enumeration to pick a LAN IP. Both pure Rust (no C, cross-compile OK).
qrcode = { version = "0.14.1", default-features = false }
if-addrs = "0.15.0"
# OS randomness for the unguessable token in a Receive-over-LAN upload URL.
# Already compiled as part of the tree (ratatui-image → rand), so no new crate.
getrandom = "0.2"
# Anti-aliased text baked into the terminal-graphics images (dialog button
# labels, disk-explorer treemap labels). `fontdue` is a pure-Rust glyph
# rasterizer (no C, ARM-cross-compile safe); `epaint_default_fonts` supplies the
# embedded Ubuntu font bytes (Latin + Cyrillic + Greek), so no font file is
# shipped separately. Baking (rather than overlaying cell text) is required
# because graphics protocols draw pixels over the terminal cells.
fontdue = "0.9.4"
epaint_default_fonts = "0.36.2"
# The viewer's Binary mode: reading ELF, PE and Mach-O executables and libraries
# (sections, linked libraries, imports, exports, symbols). Pure Rust with only
# the read side of the three formats enabled, so no C and no compression crates
# come along, and every target — the ARM cross-compiles included — reads all
# three regardless of which platform it runs on.
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "coff", "std", "archive"] }
# Symbol names as written in the source rather than as the linker spells them:
# Rust (legacy and v0) and C++ (Itanium ABI, as GCC and Clang emit). Pure Rust.
rustc-demangle = "0.1.28"
cpp_demangle = "0.5.1"
# Decoding audio files (WAV, FLAC, MP3, Ogg Vorbis, AAC/ALAC in MP4, AIFF, CAF,
# MKA) for the spectrogram and waveform. Pure Rust, and its own FFT does the
# spectrogram's transform, so no separate FFT crate comes along. Pinned to the
# 0.5 line because that is the one rodio decodes with, which keeps a single
# symphonia in the tree.
symphonia = { version = "0.5.5", default-features = false, features = ["all-formats", "all-codecs"] }
# Audio playback (the `audio` feature). `symphonia-all` is what switches on
# rodio's own symphonia decoder; the codecs themselves are the ones above.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"], optional = true }
# Reading and writing audio tags: the F4 tag editor, and the multi-rename
# `[TAG:...]` placeholders. symphonia (above) decodes audio but is read-only by
# design, so writing ID3v2 and Vorbis comments needs its own crate. Pure Rust —
# no C, so the ARM cross-compiles are unaffected — and it shares flate2,
# byteorder and crc32fast with the rest of the tree, so it brings only itself,
# `lofty_attr`, `ogg_pager` and `paste` along.
lofty = "0.25.4"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
base64 = "0.22"
rustls-native-certs = "0.8"
saphyr-parser = "0.0.12"
quick-xml = "0.41"
jsonschema = { version = "0.56.0", default-features = false }

[dev-dependencies]
# Tests synthesise small ELF, COFF and Mach-O objects to analyse, rather than
# carrying binary fixtures in the repository.
object = { version = "0.40.0", default-features = false, features = ["write"] }

# build.rs packs the vendored binary templates (assets/templates/*.bt) into one
# zlib bundle the program embeds. The same flate2 as above — pure Rust, so the
# cross-compiles run the build script on their host unchanged.
[build-dependencies]
flate2 = "1.1.10"

# nix (chmod/chown/uid lookups, process signals) is Unix-only.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "user", "signal", "process", "term"] }

# Console input-mode save/restore around suspended child programs: PowerShell
# hands the shared console back with its own input mode set, which would
# otherwise outlive it and break both the "press a key" prompt and the resumed
# TUI's key decoding. Already in the tree as crossterm's own Windows backend, so
# this adds no new crate.
[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9.1"
# The local time of day for the screensaver's clock (`GetLocalTime`). Already in
# the Windows tree through `directories` and `if-addrs`; this only names the
# bindings it needs.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[profile.release]
strip = true
opt-level = 3
