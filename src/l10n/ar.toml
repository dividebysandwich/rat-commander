"Click the map or press Space to place a point; Esc stops drawing" = "انقر على الخريطة أو اضغط Space لوضع نقطة؛ Esc يوقف الرسم"
"Click or press Space to add positions; Enter finishes, Backspace takes one back, Esc cancels" = "انقر أو اضغط Space لإضافة مواضع؛ Enter للإنهاء، Backspace لحذف آخر موضع، Esc للإلغاء"
"Click a feature to edit it, or draw a new one with 1, 2 or 3" = "انقر على معلم لتحريره، أو ارسم معلمًا جديدًا بالمفاتيح 1 أو 2 أو 3"
"Drag a position to move it or a midpoint to add one; [ ] select positions, Del removes the feature" = "اسحب موضعًا لتحريكه أو نقطة منتصف لإضافة موضع؛ [ ] لاختيار المواضع، Del لإزالة المعلم"
"Drag or Shift+arrows move the position, Insert adds one after it, Del removes it" = "السحب أو Shift+الأسهم يحرك الموضع، Insert يضيف موضعًا بعده، Del يزيله"
"Zoom in to edit the positions" = "كبّر لتحرير المواضع"
"This feature has no geometry to edit" = "لا توجد لهذا المعلم هندسة لتحريرها"
"These coordinates are not longitude and latitude" = "هذه الإحداثيات ليست خطوط طول وعرض"
"A line needs at least two positions" = "يحتاج الخط إلى موضعين على الأقل"
"A polygon needs at least three positions" = "يحتاج المضلع إلى ثلاثة مواضع على الأقل"
"Only a Feature has a name" = "لا يحمل اسمًا إلا Feature"
"This GeoJSON is part of other JSON: remove it in the text" = "هذا الـ GeoJSON جزء من JSON آخر: أزله في النص"
"Put the editor's cursor where the new FeatureCollection should go" = "ضع مؤشر المحرر حيث يجب أن تكون FeatureCollection الجديدة"

