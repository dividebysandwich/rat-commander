# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "سمة الألوان للواجهة كلها. التنقل في القائمة يعاين كل سمة مباشرةً، ومن خيارات → تحرير السمات… يمكنك تعديلها أو إضافة سماتك الخاصة."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "تحريك تدرجات الألوان في السمة. يتطلب Truecolor. عند إيقافه تبقى التدرجات ثابتة وتقلّ إعادة الرسم، مما يفيد عبر اتصال بعيد بطيء."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "عرض أيقونة لكل نوع ملف في القوائم بدلًا من العلامات / * @. يتطلب أن يكون خط الطرفية Nerd Font، وإلا ظهرت الأيقونات مربعات."
"Show CPU and memory use at the right end of the menu bar." = "عرض استخدام المعالج والذاكرة في الطرف الأيمن من شريط القوائم."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "مدة الخمول دون ضغط مفتاح أو تحريك الفأرة قبل بدء شاشة التوقف. القيمة Off لا تشغّلها أبدًا؛ وتشغيل شاشة التوقف في لوحة الأوامر يعرضها فورًا."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "الحركة التي تعرضها شاشة التوقف: حقل نجوم أو مطر الماتريكس أو ساعة سابحة أو أنابيب تمتد. القيمة Random تختار واحدة مختلفة في كل مرة."
"How many columns of file names the Brief view format puts side by side in a panel." = "عدد أعمدة أسماء الملفات التي يضعها العرض الموجز جنبًا إلى جنب في اللوحة."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "حجم الخلية في عرض الصور المصغرة: Small يعرض أكبر عدد من الصور على الشاشة، بينما Large يُظهر أكبر قدر من التفاصيل."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "كيف يرسم عرض 3D الشجرة: النمط Cubes يعرض صناديق مظللة معلقة على حلقات، أما Spare no expense فيعرض مشهدًا على طراز fsn تتشكل فيه الملفات حسب نوعها."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "إعادة قراءة اللوحة تلقائيًا عند تغيّر مجلدها على القرص، دون انتظار الضغط على Ctrl-R. يُستحسن إيقافه مع التركيبات الشبكية البطيئة أو المجلدات الضخمة."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "جعل عرض 3D يضيء المجلدات عند كتابة الملفات فيها. يراقب كل مجلد في الشجرة، لذا أوقفه مع الأشجار الضخمة أو المركّبة عبر الشبكة."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "في شجرة عمل git، يُظهر عرض التفاصيل تقويمًا لإيداعات عام كامل للعنصر المحدد. كل تقويم يشغّل git log؛ أوقفه مع المستودعات الكبيرة جدًا."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "الأمر الذي يحرر به F4 الملفات، مثل vim أو code --wait. إذا تُرك فارغًا يُستخدم $VISUAL أو $EDITOR. لا يُستخدم إلا عند إيقاف استخدام المحرر الداخلي."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "الأمر الذي يعرض به F3 الملفات، مثل less أو bat. يُستخدم $PAGER إذا تُرك فارغًا. لا يُستخدم إلا عند إيقاف استخدام العارض الداخلي."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "يفتح F3 عارض Rat Commander الخاص حتى عند تعيين عارض خارجي. ويُستخدم أيضًا كلما لم يُضبط أي عارض خارجي."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "يفتح F4 محرر Rat Commander الخاص حتى عند تعيين محرر خارجي. ويُستخدم أيضًا كلما لم يُضبط أي محرر خارجي."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "عرض سطر أوامر الصدفة أسفل اللوحات. بدونه تبدأ كتابة أي حرف بحثًا سريعًا في اللوحة النشطة. ويبدّله Ctrl-F5 أيضًا."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "البرنامج الذي يشغّله سطر الأوامر والمفتاح Ctrl-O بلا وسائط، مثل /bin/zsh أو pwsh. عند تركه فارغًا يُستخدم $SHELL، وعلى Windows تُستخدم الصدفة التي شُغّل منها rc."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "عدد أسطر الأوامر المحفوظة بين الجلسات، وتُستدعى بـ Alt-P و Alt-N و Alt-H. القيمة 0 توقف السجل، وخفضها يحذف الأقدم فورًا."
"Ask before F8 deletes the selection or moves it to the trash." = "السؤال قبل أن يحذف F8 التحديد أو ينقله إلى سلة المهملات."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "السؤال عمّا يجب فعله عندما يصادف النسخ أو النقل ملفًا موجودًا مسبقًا. عند إيقافه يُستبدل الملف دون سؤال."
"Ask before Enter runs a program or opens a file in its default application." = "السؤال قبل أن يشغّل Enter برنامجًا أو يفتح ملفًا في تطبيقه الافتراضي."
"Ask before the disk manager unmounts a filesystem." = "السؤال قبل أن يفصل مدير الأقراص نظام ملفات."
"Ask before F10 quits Rat Commander." = "السؤال قبل أن يُنهي F10 برنامج Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "ينقل F8 الملفات المحلية إلى سلة المهملات في سطح المكتب حيث يمكن استعادتها، ويبقى Shift-F8 للحذف النهائي. عند إيقافه يحذف F8 نهائيًا أيضًا."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "لغة القوائم ومربعات الحوار والرسائل، مع معاينة مباشرة أثناء التنقل في القائمة. الترجمات ملفات في مجلد lang داخل مجلد الإعدادات."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "تشكيل النص العربي والفارسي وإعادة ترتيبه للطرفيات التي لا تدعم ثنائية الاتجاه. أوقفه في الطرفيات التي تتولى ذلك بنفسها، مثل mlterm أو Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "رسوميات بكسلية لأشرطة التقدم والمخططات والصور المصغرة وأزرار الحوار. القيمة Auto تستخدم Kitty أو Sixel أو iTerm2 إن دعمتها الطرفية، أما Off فترسمها نصًا."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "استخدام ألوان 24-bit التي تحتاجها التدرجات. أوقفه إذا ظهرت الألوان بشكل خاطئ، فالطرفية على الأرجح لا تدعم إلا 256 لونًا."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "إنهاء صفوف الشاشة بأمر مسح بدلًا من المسافات، فيُنسخ النص المحدد بفأرة الطرفية دون مسافات زائدة في آخره. أوقفه إذا تقطعت الخلفيات."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "يبدّل Ctrl-PgUp و Ctrl-PgDn علامات التبويب من أي مكان في مربع الحوار هذا، ويبدّلها ← و → عندما يكون صف علامات التبويب محددًا."
"Save the changes on every tab and close the dialog." = "حفظ التغييرات في جميع علامات التبويب وإغلاق مربع الحوار."
"Close the dialog without saving anything on any tab, and undo the live previews." = "إغلاق مربع الحوار دون حفظ أي شيء في أي علامة تبويب، والتراجع عن المعاينات المباشرة."

