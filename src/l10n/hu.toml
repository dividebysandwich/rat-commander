# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Az egész felület színtémája. A listán lépkedve mindegyik azonnal megjelenik; az Opciók → Témák szerkesztése… pontban módosíthatók, vagy saját is felvehető."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Mozgásba hozza a téma animált színátmeneteit. Truecolor szükséges hozzá. Kikapcsolva állók maradnak és kevesebb az újrarajzolás, ami lassú távoli kapcsolaton segít."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Minden fájltípushoz ikont mutat a listákban a / * @ jelölők helyett. A terminálban Nerd Font betűtípus kell, különben az ikonok négyzetként jelennek meg."
"Show CPU and memory use at the right end of the menu bar." = "A CPU- és memóriahasználatot mutatja a menüsor jobb szélén."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Mennyi idő után indul a képernyővédő, ha nincs billentyűleütés vagy egérmozgás. Off esetén sosem indul; a parancspaletta Képernyővédő indítása parancsa azonnal elindítja."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Melyik animációt játssza a képernyővédő: csillagmező, mátrixeső, sodródó óra vagy növekvő csövek. A Random minden alkalommal mást választ."
"How many columns of file names the Brief view format puts side by side in a panel." = "Hány oszlopnyi fájlnév áll egymás mellett egy panelen a Rövid nézet formátumban."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "A Bélyegképnézet cellamérete: Small esetén fér ki a legtöbb kép a képernyőre, Large esetén látszik a legtöbb részlet."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Hogyan rajzolja a 3D nézet a fát: Cubes – gyűrűkön függő árnyékolt dobozok, vagy Spare no expense – fsn-stílusú táj, típus szerint formált fájlokkal."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Magától újraolvassa a panelt, ha a könyvtára megváltozik a lemezen, nem kell a Ctrl-R-re várni. Lassú hálózati csatolásoknál vagy óriási könyvtáraknál érdemes kikapcsolni."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "A 3D nézet felvillantja azokat a könyvtárakat, amelyekbe fájlok íródnak. A fa minden könyvtárát figyeli, ezért óriási vagy hálózaton csatolt fáknál kapcsolja ki."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "Git munkafában a Részletes nézet naptárban mutatja a kijelölt elem egy évnyi commitját. Mindegyik git log futtatásával jár; nagyon nagy tárolóknál kapcsolja ki."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "A parancs, amellyel az F4 fájlokat szerkeszt, pl. vim vagy code --wait. Üresen a $VISUAL vagy az $EDITOR érvényes. Csak kikapcsolt Belső szerkesztő használata mellett számít."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "A parancs, amellyel az F3 fájlokat jelenít meg, pl. less vagy bat. Üresen a $PAGER érvényes. Csak kikapcsolt Belső megjelenítő használata mellett számít."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "Az F3 a Rat Commander saját megjelenítőjét nyitja meg akkor is, ha külső megjelenítő van beállítva. Ha nincs külső megjelenítő beállítva, mindig ez indul."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "Az F4 a Rat Commander saját szerkesztőjét nyitja meg akkor is, ha külső szerkesztő van beállítva. Ha nincs külső szerkesztő beállítva, mindig ez indul."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Megjeleníti a héj parancssorát a panelek alatt. Nélküle egy betű begépelése gyorskeresést indít az aktív panelen. A Ctrl-F5 is ki-be kapcsolja."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "A program, amelyet a parancssor és a Ctrl-O futtat, pl. /bin/zsh vagy pwsh, argumentumok nélkül. Üresen a $SHELL érvényes (Windowson az a héj, amelyből az rc indult)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Hány parancssort őriz meg a munkamenetek között; az Alt-P, Alt-N és Alt-H hívja elő őket. A 0 kikapcsolja az előzményeket; csökkentéskor a legrégebbiek azonnal törlődnek."
"Ask before F8 deletes the selection or moves it to the trash." = "Rákérdez, mielőtt az F8 törli a kijelölést vagy a kukába helyezi."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Rákérdez, mi történjen, ha másoláskor vagy áthelyezéskor a fájl már létezik. Kikapcsolva kérdés nélkül felülírja."
"Ask before Enter runs a program or opens a file in its default application." = "Rákérdez, mielőtt az Enter futtat egy programot vagy megnyit egy fájlt az alapértelmezett alkalmazásában."
"Ask before the disk manager unmounts a filesystem." = "Rákérdez, mielőtt a lemezkezelő leválaszt egy fájlrendszert."
"Ask before F10 quits Rat Commander." = "Rákérdez, mielőtt az F10 kilép a Rat Commanderből."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "Az F8 a helyi fájlokat az asztali környezet kukájába helyezi, ahonnan visszaállíthatók; a Shift-F8 továbbra is véglegesen töröl. Kikapcsolva az F8 is véglegesen töröl."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "A menük, párbeszédablakok és üzenetek nyelve; a listán lépkedve azonnal megjelenik. A fordítások a konfigurációs könyvtár lang mappájában lévő fájlok."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Átformálja és átrendezi az arab és perzsa szöveget a bidi-támogatás nélküli terminálokhoz. Kapcsolja ki az ezt maguk kezelő terminálokon, pl. mlterm vagy Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Pixelgrafika a folyamatjelzőkhöz, grafikonokhoz, bélyegképekhez és gombokhoz. Az Auto a Kitty, Sixel vagy iTerm2 módot használja, ha a terminál ismeri; az Off szöveggel rajzol."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "24 bites színek használata, amelyek az átmenetekhez kellenek. Kapcsolja ki, ha a színek hibásak: a terminál valószínűleg csak 256 színt ismer."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "A képernyősorokat törléssel zárja szóközök helyett, így a terminál egerével kijelölt szöveg sorvégi szóközök nélkül másolódik. Kapcsolja ki, ha a háttér szétesik."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "A Ctrl-PgUp és Ctrl-PgDn a párbeszédablakban bárhonnan lapot vált; a ← és → akkor vált lapot, ha a lapsor ki van emelve."
"Save the changes on every tab and close the dialog." = "Minden lapon menti a módosításokat, és bezárja a párbeszédablakot."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Bezárja a párbeszédablakot anélkül, hogy bármelyik lapon bármit mentene, és visszavonja az élő előnézeteket."

