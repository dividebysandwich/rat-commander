# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "पूरे इंटरफ़ेस की रंग थीम। सूची में आगे बढ़ते ही हर थीम का लाइव पूर्वावलोकन दिखता है; विकल्प → थीम संपादित करें… से इन्हें बदलें या अपनी थीम जोड़ें।"
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "थीम के एनिमेटेड रंग ग्रेडिएंट को बहने दें। Truecolor आवश्यक है। बंद होने पर ये स्थिर रहते हैं और स्क्रीन कम बार दोबारा बनती है, जो धीमे रिमोट कनेक्शन पर मदद करता है।"
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "सूचियों में / * @ चिह्नों की जगह हर फ़ाइल प्रकार का आइकन दिखाएँ। टर्मिनल का फ़ॉन्ट Nerd Font होना चाहिए, वरना आइकन खाली डिब्बों जैसे दिखते हैं।"
"Show CPU and memory use at the right end of the menu bar." = "मेनू बार के दाएँ सिरे पर CPU और मेमोरी का उपयोग दिखाएँ।"
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "कोई कुंजी दबाए या माउस हिलाए बिना कितनी देर बाद स्क्रीनसेवर शुरू हो। Off पर यह कभी शुरू नहीं होता; कमांड पैलेट में “स्क्रीनसेवर शुरू करें” इसे तुरंत दिखाता है।"
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "स्क्रीनसेवर कौन-सा एनिमेशन चलाए: तारों भरा आकाश, मैट्रिक्स बारिश, तैरती घड़ी या बढ़ते पाइप। Random हर बार अलग एनिमेशन चुनता है।"
"How many columns of file names the Brief view format puts side by side in a panel." = "संक्षिप्त दृश्य में पैनल के भीतर फ़ाइल नामों के कितने कॉलम साथ-साथ दिखें।"
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "थंबनेल दृश्य में सेल का आकार: Small स्क्रीन पर सबसे ज़्यादा चित्र दिखाता है, Large सबसे ज़्यादा बारीकी।"
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "3D दृश्य ट्री कैसे बनाए: Cubes — छल्लों पर लटके छायांकित बक्से, या Spare no expense — fsn-शैली का परिदृश्य, जिसमें फ़ाइलों का आकार उनके प्रकार से तय होता है।"
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "डिस्क पर निर्देशिका बदलते ही पैनल अपने-आप दोबारा पढ़ें, Ctrl-R का इंतज़ार किए बिना। धीमे नेटवर्क माउंट या बहुत बड़ी निर्देशिकाओं पर इसे बंद करना बेहतर है।"
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "फ़ाइलें लिखे जाने पर 3D दृश्य में निर्देशिकाएँ चमकें। यह ट्री की हर निर्देशिका पर नज़र रखता है, इसलिए बहुत बड़े या नेटवर्क पर माउंट ट्री के लिए इसे बंद करें।"
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "git वर्क ट्री में विवरण दृश्य चयनित आइटम के एक वर्ष के कमिट का कैलेंडर दिखाता है। हर बार git log चलता है; बहुत बड़ी रिपॉज़िटरी के लिए इसे बंद करें।"
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "वह कमांड जिससे F4 फ़ाइलें संपादित करता है, जैसे vim या code --wait। खाली = $VISUAL या $EDITOR। केवल तब उपयोग होता है जब “आंतरिक संपादक उपयोग करें” बंद हो।"
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "वह कमांड जिससे F3 फ़ाइलें देखता है, जैसे less या bat। खाली = $PAGER। केवल तब उपयोग होता है जब “आंतरिक व्यूअर उपयोग करें” बंद हो।"
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 से Rat Commander का अपना व्यूअर खुलता है, भले ही बाहरी व्यूअर सेट हो। कोई बाहरी व्यूअर कॉन्फ़िगर न होने पर भी यही उपयोग होता है।"
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 से Rat Commander का अपना संपादक खुलता है, भले ही बाहरी संपादक सेट हो। कोई बाहरी संपादक कॉन्फ़िगर न होने पर भी यही उपयोग होता है।"
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "पैनलों के नीचे शेल की कमांड लाइन दिखाएँ। इसके बिना कोई अक्षर टाइप करने पर सक्रिय पैनल में त्वरित खोज शुरू होती है। Ctrl-F5 से भी इसे बदला जा सकता है।"
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "वह प्रोग्राम जिसे कमांड लाइन और Ctrl-O चलाते हैं, जैसे /bin/zsh या pwsh, बिना आर्गुमेंट के। खाली = $SHELL (Windows पर, वह शेल जिससे rc शुरू हुआ)।"
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "सत्रों के बीच कितनी कमांड लाइनें याद रहें, जिन्हें Alt-P, Alt-N और Alt-H से वापस लाया जाता है। 0 इतिहास बंद करता है; घटाने पर सबसे पुरानी तुरंत हट जाती हैं।"
"Ask before F8 deletes the selection or moves it to the trash." = "F8 से चयन मिटाने या रद्दी में ले जाने से पहले पूछें।"
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "कॉपी या स्थानांतरण के दौरान पहले से मौजूद फ़ाइल मिलने पर पूछें कि क्या करना है। बंद होने पर फ़ाइल बिना पूछे बदल दी जाती है।"
"Ask before Enter runs a program or opens a file in its default application." = "Enter से प्रोग्राम चलाने या फ़ाइल को उसके डिफ़ॉल्ट ऐप्लिकेशन में खोलने से पहले पूछें।"
"Ask before the disk manager unmounts a filesystem." = "डिस्क मैनेजर द्वारा फ़ाइल सिस्टम अनमाउंट करने से पहले पूछें।"
"Ask before F10 quits Rat Commander." = "F10 से Rat Commander बंद करने से पहले पूछें।"
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 स्थानीय फ़ाइलों को डेस्कटॉप की रद्दी में ले जाता है, जहाँ से उन्हें वापस लाया जा सकता है; Shift-F8 फिर भी स्थायी रूप से मिटाता है। बंद होने पर F8 भी स्थायी रूप से मिटाता है।"
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "मेनू, डायलॉग और संदेशों की भाषा; सूची में आगे बढ़ते ही इसका लाइव पूर्वावलोकन होता है। अनुवाद कॉन्फ़िग निर्देशिका के lang फ़ोल्डर में फ़ाइलों के रूप में हैं।"
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "bidi समर्थन के बिना टर्मिनलों के लिए अरबी और फ़ारसी पाठ को आकार दें और क्रम ठीक करें। जो टर्मिनल यह खुद करते हैं, जैसे mlterm या Konsole, उन पर इसे बंद करें।"
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "प्रोग्रेस बार, ग्राफ़, थंबनेल और डायलॉग बटनों के लिए पिक्सेल ग्राफ़िक्स। Auto टर्मिनल में उपलब्ध होने पर Kitty, Sixel या iTerm2 का उपयोग करता है; Off इन्हें पाठ के रूप में बनाता है।"
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "24-bit रंग का उपयोग करें, जो ग्रेडिएंट के लिए ज़रूरी है। रंग गलत दिखें तो इसे बंद करें: टर्मिनल शायद केवल 256 रंग समर्थित करता है।"
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "स्क्रीन की पंक्तियों को स्पेस की जगह मिटाने (erase) के संकेत से समाप्त करें, ताकि टर्मिनल में माउस से चुना पाठ अंत के खाली स्थानों के बिना कॉपी हो। बैकग्राउंड टूटे तो इसे बंद करें।"
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp और Ctrl-PgDn इस डायलॉग में कहीं से भी टैब बदलते हैं; टैब पंक्ति हाइलाइट होने पर ← और → से टैब बदलते हैं।"
"Save the changes on every tab and close the dialog." = "सभी टैब के बदलाव सहेजें और डायलॉग बंद करें।"
"Close the dialog without saving anything on any tab, and undo the live previews." = "किसी भी टैब का कुछ भी सहेजे बिना डायलॉग बंद करें और लाइव पूर्वावलोकन पूर्ववत करें।"

