# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Het kleurthema van de hele interface. Bladeren door de lijst toont elk thema meteen; Opties → Thema's bewerken… past ze aan of voegt eigen thema's toe."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Laat de geanimeerde kleurverlopen van een thema stromen. Vereist Truecolor. Uitgeschakeld staan ze stil en hoeft er minder te worden hertekend, handig via een trage externe verbinding."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Toont in de lijsten een pictogram per bestandstype in plaats van de markeringen / * @. Vereist een Nerd Font als lettertype van de terminal, anders verschijnen de pictogrammen als vakjes."
"Show CPU and memory use at the right end of the menu bar." = "Toont CPU- en geheugengebruik rechts in de menubalk."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Hoe lang zonder toetsaanslag of muisbeweging voordat de schermbeveiliging start. Off start hem nooit; Schermbeveiliging starten in het opdrachtenpalet toont hem meteen."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Welke animatie de schermbeveiliging afspeelt: een sterrenveld, matrixregen, een zwevende klok of groeiende buizen. Random kiest telkens een andere."
"How many columns of file names the Brief view format puts side by side in a panel." = "Hoeveel kolommen met bestandsnamen de beknopte weergave in een paneel naast elkaar zet."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "De celgrootte van de miniatuurweergave: Small past de meeste afbeeldingen op het scherm, Large toont de meeste details."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Hoe de 3D-weergave een boom tekent: Cubes, gearceerde blokken die aan ringen hangen, of Spare no expense, een fsn-achtig landschap met bestanden gevormd naar hun type."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Leest een paneel vanzelf opnieuw in als de map op schijf verandert, zonder op Ctrl-R te wachten. Beter uitschakelen bij trage netwerkkoppelingen of enorme mappen."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "Laat de 3D-weergave mappen oplichten terwijl er bestanden in worden geschreven. Bewaakt elke map in de boom, dus schakel het uit bij enorme bomen of bomen op het netwerk."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "In een git-werkmap toont de detailweergave een kalender met een jaar aan commits voor het geselecteerde item. Elke kalender draait git log; schakel het uit bij zeer grote repository's."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "De opdracht waarmee F4 bestanden bewerkt, zoals vim of code --wait. Leeg gebruikt $VISUAL of $EDITOR. Alleen gebruikt zolang Interne editor gebruiken uit staat."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "De opdracht waarmee F3 bestanden bekijkt, zoals less of bat. Leeg gebruikt $PAGER. Alleen gebruikt zolang Interne viewer gebruiken uit staat."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 opent de eigen viewer van Rat Commander, ook als er een externe viewer is ingesteld. Zonder ingestelde externe viewer wordt hij sowieso gebruikt."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 opent de eigen editor van Rat Commander, ook als er een externe editor is ingesteld. Zonder ingestelde externe editor wordt hij sowieso gebruikt."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Toont de shell-opdrachtregel onder de panelen. Zonder opdrachtregel start het typen van een letter een snelzoekactie in het actieve paneel. Ctrl-F5 schakelt hem ook in of uit."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Het programma dat de opdrachtregel en Ctrl-O starten, zoals /bin/zsh of pwsh, zonder argumenten. Leeg gebruikt $SHELL (op Windows de shell van waaruit rc is gestart)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Hoeveel opdrachtregels over sessies heen worden onthouden, op te roepen met Alt-P, Alt-N en Alt-H. 0 schakelt de geschiedenis uit; verlagen wist meteen de oudste."
"Ask before F8 deletes the selection or moves it to the trash." = "Vraagt om bevestiging voordat F8 de selectie verwijdert of naar de prullenbak verplaatst."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Vraagt wat er moet gebeuren als kopiëren of verplaatsen op een bestaand bestand stuit. Uitgeschakeld wordt het zonder vragen vervangen."
"Ask before Enter runs a program or opens a file in its default application." = "Vraagt om bevestiging voordat Enter een programma uitvoert of een bestand in de standaardtoepassing opent."
"Ask before the disk manager unmounts a filesystem." = "Vraagt om bevestiging voordat schijfbeheer een bestandssysteem ontkoppelt."
"Ask before F10 quits Rat Commander." = "Vraagt om bevestiging voordat F10 Rat Commander afsluit."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 verplaatst lokale bestanden naar de prullenbak van het bureaublad, waar ze te herstellen zijn; Shift-F8 verwijdert nog steeds definitief. Uitgeschakeld verwijdert ook F8 definitief."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "De taal van menu's, dialoogvensters en meldingen, meteen zichtbaar terwijl u door de lijst bladert. Vertalingen zijn bestanden in de map lang van de configuratiemap."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Vormt en herschikt Arabische en Perzische tekst voor terminals zonder bidi-ondersteuning. Schakel het uit op terminals die dat zelf doen, zoals mlterm of Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Pixelafbeeldingen voor voortgangsbalken, grafieken, miniaturen en dialoogknoppen. Auto gebruikt Kitty, Sixel of iTerm2 als de terminal dat kan; Off tekent ze als tekst."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Gebruikt 24-bits kleur, nodig voor verlopen. Schakel het uit als kleuren er verkeerd uitzien: de terminal ondersteunt dan waarschijnlijk maar 256 kleuren."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Sluit schermregels af met een wisopdracht in plaats van spaties, zodat met de terminalmuis geselecteerde tekst zonder spaties aan het eind wordt gekopieerd. Schakel het uit als achtergronden onderbroken raken."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp en Ctrl-PgDn wisselen overal in dit dialoogvenster van tabblad; ← en → doen dat zolang de tabbladrij gemarkeerd is."
"Save the changes on every tab and close the dialog." = "Slaat de wijzigingen op alle tabbladen op en sluit het dialoogvenster."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Sluit het dialoogvenster zonder iets op te slaan op welk tabblad dan ook, en maakt de live voorbeelden ongedaan."

