# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Farebný motív celého rozhrania. Pri prechádzaní zoznamom sa každý hneď predvedie; v ponuke Možnosti → Upraviť motívy… ich môžete upraviť alebo pridať vlastné."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Nechať animované farebné prechody motívu plynúť. Vyžaduje Truecolor. Po vypnutí zostanú nehybné a ubudne prekresľovania, čo pomôže pri pomalom vzdialenom pripojení."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Zobraziť pri každom type súboru ikonu namiesto značiek / * @. Terminál musí používať Nerd Font, inak sa ikony zobrazia ako štvorčeky."
"Show CPU and memory use at the right end of the menu bar." = "Zobraziť využitie CPU a pamäte na pravom konci riadka ponúk."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Ako dlho bez stlačenia klávesu alebo pohybu myši čakať, kým sa spustí šetrič obrazovky. S Off sa nespustí nikdy; Spustiť šetrič obrazovky v palete príkazov ho spustí hneď."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Akú animáciu šetrič prehráva: hviezdne pole, matrixový dážď, plávajúce hodiny alebo rastúce rúry. Random zakaždým vyberie inú."
"How many columns of file names the Brief view format puts side by side in a panel." = "Koľko stĺpcov názvov súborov vedľa seba zobrazí Stručné zobrazenie v paneli."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "Veľkosť buniek režimu Náhľady: Small zmestí na obrazovku najviac obrázkov, Large ukáže najviac detailov."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Ako 3D zobrazenie kreslí strom: Cubes, tieňované kvádre zavesené na prstencoch, alebo Spare no expense, krajina v štýle fsn so súbormi tvarovanými podľa typu."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Samočinne znovu načítať panel, keď sa jeho adresár na disku zmení, bez čakania na Ctrl-R. Na pomalých sieťových diskoch alebo pri obrovských adresároch sa oplatí vypnúť."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "Nechať 3D zobrazenie rozsvecovať adresáre, do ktorých sa zapisujú súbory. Sleduje každý adresár stromu, preto pri obrovských alebo sieťovo pripojených stromoch vypnite."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "V pracovnom strome gitu ukazuje Podrobné zobrazenie kalendár commitov vybranej položky za posledný rok. Každý kalendár spúšťa git log; pri veľmi veľkých repozitároch vypnite."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "Príkaz, ktorým F4 upravuje súbory, napr. vim alebo code --wait. Prázdne použije $VISUAL alebo $EDITOR. Platí len vtedy, keď je Použiť interný editor vypnuté."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "Príkaz, ktorým F3 zobrazuje súbory, napr. less alebo bat. Prázdne použije $PAGER. Platí len vtedy, keď je Použiť interný prehliadač vypnuté."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 otvorí vlastný prehliadač Rat Commandera, aj keď je nastavený externý prehliadač. Použije sa aj vždy, keď nie je nastavený žiadny externý prehliadač."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 otvorí vlastný editor Rat Commandera, aj keď je nastavený externý editor. Použije sa aj vždy, keď nie je nastavený žiadny externý editor."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Zobraziť príkazový riadok shellu pod panelmi. Bez neho písanie písmen spúšťa rýchle hľadanie v aktívnom paneli. Prepína ho aj Ctrl-F5."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Program, ktorý spúšťa príkazový riadok a Ctrl-O, napr. /bin/zsh alebo pwsh, bez argumentov. Prázdne použije $SHELL (vo Windows shell, z ktorého bol rc spustený)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Koľko príkazov si program pamätá medzi reláciami (vyvolanie cez Alt-P, Alt-N a Alt-H). 0 históriu vypne; zníženie hodnoty hneď zahodí tie najstaršie."
"Ask before F8 deletes the selection or moves it to the trash." = "Opýtať sa, než F8 odstráni výber alebo ho presunie do koša."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Opýtať sa, čo robiť, keď kopírovanie alebo presun narazí na už existujúci súbor. Po vypnutí sa súbor prepíše bez pýtania."
"Ask before Enter runs a program or opens a file in its default application." = "Opýtať sa, než Enter spustí program alebo otvorí súbor v predvolenej aplikácii."
"Ask before the disk manager unmounts a filesystem." = "Opýtať sa, než správca diskov odpojí súborový systém."
"Ask before F10 quits Rat Commander." = "Opýtať sa, než F10 ukončí Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 presúva miestne súbory do systémového koša, odkiaľ ich možno obnoviť; Shift-F8 naďalej odstraňuje natrvalo. Po vypnutí odstraňuje natrvalo aj F8."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "Jazyk ponúk, dialógov a správ; pri prechádzaní zoznamom sa hneď predvedie. Preklady sú súbory v priečinku lang v konfiguračnom adresári."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Tvarovať a preusporiadať arabský a perzský text pre terminály bez podpory bidi. Vypnite v termináloch, ktoré to zvládajú samy, napr. mlterm alebo Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Pixelová grafika pre indikátory priebehu, grafy, náhľady a tlačidlá dialógov. Auto použije Kitty, Sixel alebo iTerm2, ak ich terminál podporuje; s Off sa kreslia textom."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Používať 24-bitové farby, ktoré prechody potrebujú. Ak farby vyzerajú zle, vypnite: terminál asi podporuje len 256 farieb."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Ukončovať riadky obrazovky vymazaním namiesto medzier, aby sa text označený myšou v termináli kopíroval bez koncových medzier. Vypnite, ak sa rozpadá pozadie."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp a Ctrl-PgDn prepínajú karty odkiaľkoľvek v tomto dialógu; ← a → ich prepínajú, keď je zvýraznený riadok kariet."
"Save the changes on every tab and close the dialog." = "Uloží zmeny na všetkých kartách a zavrie dialóg."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Zavrie dialóg bez uloženia čohokoľvek na ktorejkoľvek karte a vráti živé náhľady späť."

