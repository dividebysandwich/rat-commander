# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Tema boja celog interfejsa. Dok se krećete kroz listu, svaka se odmah prikazuje; u Opcije → Uredi teme… možete ih menjati ili dodati svoje."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Pušta da animirani prelivi boja teme teku. Zahteva Truecolor. Kad je isključeno, stoje u mestu i ekran se ređe iscrtava, što pomaže preko spore udaljene veze."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Prikazuje ikonu za svaki tip fajla u listama umesto oznaka / * @. Terminal mora da koristi Nerd Font, inače se ikone prikazuju kao kvadratići."
"Show CPU and memory use at the right end of the menu bar." = "Prikazuje zauzeće CPU-a i memorije na desnom kraju trake menija."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Koliko dugo bez pritiska tastera ili pomeranja miša pre nego što se pokrene čuvar ekrana. Uz Off se nikad ne pokreće; Pokreni čuvar ekrana u paleti komandi ga pokreće odmah."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Koju animaciju čuvar ekrana prikazuje: zvezdano polje, Matriks kišu, sat koji lebdi ili cevi koje rastu. Random svaki put bira drugu."
"How many columns of file names the Brief view format puts side by side in a panel." = "Koliko kolona imena fajlova Kratak prikaz ređa jednu pored druge u panelu."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "Veličina ćelija u prikazu Sličice: uz Small na ekran staje najviše slika, uz Large se vidi najviše detalja."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Kako 3D prikaz crta stablo: Cubes, senčene kutije okačene o prstenove, ili Spare no expense, pejzaž u stilu fsn sa fajlovima oblikovanim po tipu."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Sam ponovo učitava panel kad se njegov direktorijum promeni na disku, bez čekanja na Ctrl-R. Vredi isključiti na sporim mrežnim montažama ili ogromnim direktorijumima."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "3D prikaz osvetljava direktorijume u koje se upisuju fajlovi. Prati svaki direktorijum u stablu, pa ga isključite za ogromna ili mrežno montirana stabla."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "U git radnom stablu Detaljan prikaz pokazuje kalendar komitova izabrane stavke za godinu dana. Svaki kalendar pokreće git log; isključite za vrlo velike repozitorijume."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "Komanda kojom F4 uređuje fajlove, npr. vim ili code --wait. Prazno koristi $VISUAL ili $EDITOR. Koristi se samo dok je Koristi interni uređivač isključeno."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "Komanda kojom F3 prikazuje fajlove, npr. less ili bat. Prazno koristi $PAGER. Koristi se samo dok je Koristi interni pregledač isključeno."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 otvara pregledač samog Rat Commandera čak i kad je podešen spoljni pregledač. Koristi se i kad god spoljni pregledač nije podešen."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 otvara uređivač samog Rat Commandera čak i kad je podešen spoljni uređivač. Koristi se i kad god spoljni uređivač nije podešen."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Prikazuje komandnu liniju ljuske ispod panela. Bez nje kucanje slova pokreće brzu pretragu u aktivnom panelu. Uključuje se i isključuje i sa Ctrl-F5."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Program koji pokreću komandna linija i Ctrl-O, npr. /bin/zsh ili pwsh, bez argumenata. Prazno koristi $SHELL (na Windows-u ljusku iz koje je rc pokrenut)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Koliko se komandi pamti između sesija; pozivaju se sa Alt-P, Alt-N i Alt-H. 0 isključuje istoriju; smanjenje vrednosti odmah odbacuje najstarije."
"Ask before F8 deletes the selection or moves it to the trash." = "Pita pre nego što F8 obriše izbor ili ga premesti u korpu za otpatke."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Pita šta da radi kad kopiranje ili premeštanje naiđe na fajl koji već postoji. Kad je isključeno, fajl se zamenjuje bez pitanja."
"Ask before Enter runs a program or opens a file in its default application." = "Pita pre nego što Enter pokrene program ili otvori fajl u podrazumevanoj aplikaciji."
"Ask before the disk manager unmounts a filesystem." = "Pita pre nego što upravnik diskova demontira fajl sistem."
"Ask before F10 quits Rat Commander." = "Pita pre nego što F10 zatvori Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 premešta lokalne fajlove u sistemsku korpu za otpatke, odakle se mogu vratiti; Shift-F8 i dalje briše trajno. Kad je isključeno, i F8 briše trajno."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "Jezik menija, dijaloga i poruka, sa trenutnim pregledom dok se krećete kroz listu. Prevodi su fajlovi u fascikli lang u konfiguracionom direktorijumu."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Oblikuje i preuređuje arapski i persijski tekst za terminale bez podrške za bidi. Isključite na terminalima koji to rade sami, npr. mlterm ili Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Pikselna grafika za trake napretka, grafikone, sličice i dugmad dijaloga. Auto koristi Kitty, Sixel ili iTerm2 kad ih terminal podržava; uz Off se crtaju tekstom."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Koristi 24-bitne boje, potrebne za prelive. Isključite ako boje izgledaju pogrešno: terminal verovatno podržava samo 256 boja."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Završava redove ekrana brisanjem umesto razmacima, pa se tekst izabran mišem u terminalu kopira bez razmaka na kraju. Isključite ako se pozadina raspada."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp i Ctrl-PgDn menjaju kartice bilo gde u ovom dijalogu; ← i → ih menjaju dok je red kartica istaknut."
"Save the changes on every tab and close the dialog." = "Čuva izmene na svim karticama i zatvara dijalog."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Zatvara dijalog bez čuvanja bilo čega na bilo kojoj kartici i poništava trenutne preglede."

