# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "整個介面的佈景主題。在清單中移動時會即時預覽；可透過「選項 → 編輯佈景主題…」修改或新增自己的佈景主題。"
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "讓佈景主題的動畫漸層流動，需要 Truecolor。關閉後漸層保持靜止並減少重繪，有助於較慢的遠端連線。"
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "在清單中為每種檔案類型顯示圖示，取代 / * @ 標記。終端機字型須為 Nerd Font，否則圖示會顯示為方塊。"
"Show CPU and memory use at the right end of the menu bar." = "在選單列右端顯示 CPU 與記憶體使用量。"
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "多久沒有按鍵或滑鼠移動後啟動螢幕保護程式。Off 表示永不啟動；命令選擇區中的「啟動螢幕保護程式」可立即啟動。"
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "螢幕保護程式播放的動畫：星空、矩陣字元雨、飄移的時鐘或延伸的管線。Random 每次隨機挑選一種。"
"How many columns of file names the Brief view format puts side by side in a panel." = "簡略檢視在一個面板中並排顯示的檔案名稱欄數。"
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "縮圖檢視的格子大小：Small 可在畫面上顯示最多圖片，Large 顯示最多細節。"
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "3D 檢視繪製樹狀結構的方式：Cubes 是掛在圓環上的陰影方塊，Spare no expense 是 fsn 風格的地景，檔案形狀依類型而異。"
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "目錄在磁碟上變更時自動重新讀取面板，不必等待 Ctrl-R。在較慢的網路掛載或非常大的目錄上建議關閉。"
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "有檔案寫入時，在 3D 檢視中點亮對應的目錄。此功能會監看樹中的每個目錄，因此非常大或網路掛載的樹請關閉。"
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "在 git 工作樹中，詳細檢視會以日曆顯示所選項目一年內的提交。每次都會執行 git log，非常大的儲存庫請關閉此項。"
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "F4 編輯檔案時使用的命令，例如 vim 或 code --wait。空白則使用 $VISUAL 或 $EDITOR。僅在「使用內建編輯器」關閉時使用。"
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "F3 檢視檔案時使用的命令，例如 less 或 bat。空白則使用 $PAGER。僅在「使用內建檢視器」關閉時使用。"
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "即使已設定外部檢視器，F3 也會開啟 Rat Commander 自己的檢視器。未設定外部檢視器時也一律使用它。"
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "即使已設定外部編輯器，F4 也會開啟 Rat Commander 自己的編輯器。未設定外部編輯器時也一律使用它。"
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "在面板下方顯示 shell 命令列。隱藏時，輸入字母會在作用中的面板開始快速搜尋。也可用 Ctrl-F5 切換。"
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "命令列與 Ctrl-O 執行的程式，例如 /bin/zsh 或 pwsh，不含參數。空白則使用 $SHELL（在 Windows 上為啟動 rc 的 shell）。"
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "跨工作階段記住的命令列筆數，可用 Alt-P、Alt-N 和 Alt-H 叫出。0 表示關閉歷程；調低時會立即捨棄最舊的項目。"
"Ask before F8 deletes the selection or moves it to the trash." = "F8 刪除選取項目或將其移至回收筒前詢問。"
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "複製或移動時遇到已存在的檔案，詢問如何處理。關閉後會直接覆寫，不再詢問。"
"Ask before Enter runs a program or opens a file in its default application." = "按 Enter 執行程式或以預設應用程式開啟檔案前詢問。"
"Ask before the disk manager unmounts a filesystem." = "磁碟管理員卸載檔案系統前詢問。"
"Ask before F10 quits Rat Commander." = "按 F10 結束 Rat Commander 前詢問。"
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 會將本機檔案移至桌面回收筒，之後可以還原；Shift-F8 仍會永久刪除。關閉後 F8 也會永久刪除。"
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "選單、對話方塊與訊息的語言，在清單中移動時即時預覽。翻譯檔位於設定目錄的 lang 資料夾中。"
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "為不支援 bidi 的終端機塑形並重新排列阿拉伯文與波斯文。在會自行處理的終端機（如 mlterm 或 Konsole）上請關閉。"
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "用於進度列、圖表、縮圖與對話方塊按鈕的像素圖形。Auto 會在終端機支援時使用 Kitty、Sixel 或 iTerm2；Off 則以文字繪製。"
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "使用 24-bit 色彩，漸層需要此項。顏色看起來不對時請關閉：終端機可能只支援 256 色。"
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "螢幕列尾以清除取代空白結束，讓用終端機滑鼠選取的文字複製時不帶行尾空白。若背景出現斷裂請關閉。"
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "在此對話方塊的任何位置按 Ctrl-PgUp 和 Ctrl-PgDn 可切換分頁；分頁列反白時，← 和 → 也可切換。"
"Save the changes on every tab and close the dialog." = "儲存所有分頁上的變更並關閉對話方塊。"
"Close the dialog without saving anything on any tab, and undo the live previews." = "關閉對話方塊，不儲存任何分頁上的變更，並復原即時預覽。"

