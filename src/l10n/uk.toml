"Drag to pan, wheel or +/- to zoom, click a feature, n/p to step through them" = "Перетягніть, щоб зсунути, колесо або +/- — масштаб, клік вибирає об’єкт, n/p — перехід між ними"
"No GeoJSON found in this file" = "У цьому файлі немає GeoJSON"
"Edit features" = "Редагувати об’єкти"
"Stop editing" = "Завершити редагування"
"Point" = "Точка"
"Line" = "Лінія"
"Polygon" = "Полігон"
"Remove" = "Вилучити"
"Undo" = "Скасувати"
"Redo" = "Повторити"
"Rename" = "Перейменувати"
"New collection" = "Нова колекція"
"Click the map or press Space to place a point; Esc stops drawing" = "Клацніть на карті або натисніть пробіл, щоб поставити точку; Esc припиняє малювання"
"Click or press Space to add positions; Enter finishes, Backspace takes one back, Esc cancels" = "Клацання або пробіл додає позиції; Enter завершує, Backspace забирає одну, Esc скасовує"
"Click a feature to edit it, or draw a new one with 1, 2 or 3" = "Клацніть об’єкт, щоб редагувати його, або намалюйте новий клавішами 1, 2 чи 3"
"Drag a position to move it or a midpoint to add one; [ ] select positions, Del removes the feature" = "Перетягніть позицію, щоб зсунути її, або середину, щоб додати нову; [ ] вибирає позиції, Del вилучає об’єкт"
"Drag or Shift+arrows move the position, Insert adds one after it, Del removes it" = "Перетягування або Shift+стрілки зсувають позицію, Insert додає нову після неї, Del вилучає її"
"Zoom in to edit the positions" = "Збільште масштаб, щоб редагувати позиції"
"This feature has no geometry to edit" = "Цей об’єкт не має геометрії для редагування"
"These coordinates are not longitude and latitude" = "Ці координати не є довготою і широтою"
"A line needs at least two positions" = "Лінії потрібні щонайменше дві позиції"
"A polygon needs at least three positions" = "Полігону потрібні щонайменше три позиції"
"Only a Feature has a name" = "Назву має лише Feature"
"This GeoJSON is part of other JSON: remove it in the text" = "Цей GeoJSON є частиною іншого JSON: вилучіть його в тексті"
"Put the editor's cursor where the new FeatureCollection should go" = "Поставте курсор редактора туди, де має бути нова FeatureCollection"

