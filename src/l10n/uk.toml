# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Колірна тема всього інтерфейсу. Під час переміщення списком кожну тему одразу видно в дії; Опції → Редагувати теми… дає змогу змінити їх або додати власні."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Плавна анімація колірних градієнтів теми. Потрібен Truecolor. Якщо вимкнено, градієнти нерухомі, а екран перемальовується рідше — це допомагає на повільному віддаленому з'єднанні."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Показувати у списках значок типу файлу замість позначок / * @. Шрифтом терміналу має бути Nerd Font, інакше замість значків будуть квадратики."
"Show CPU and memory use at the right end of the menu bar." = "Показувати завантаження процесора й пам'яті праворуч у рядку меню."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Скільки часу без натискань клавіш і рухів миші має минути до запуску заставки. Off — не запускати; «Запустити заставку» в палітрі команд покаже її одразу."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Яку анімацію показує заставка: зоряне поле, дощ із «Матриці», пливучий годинник або труби, що ростуть. Random щоразу вибирає іншу."
"How many columns of file names the Brief view format puts side by side in a panel." = "Скільки стовпців з іменами файлів «Стислий вигляд» розміщує поруч на панелі."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "Розмір клітинки у вигляді «Мініатюри»: Small вміщує на екрані найбільше зображень, Large показує найбільше деталей."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Як 3D-вигляд малює дерево: Cubes — затінені блоки, що висять на кільцях, або Spare no expense — ландшафт у стилі fsn, де форма файлу залежить від його типу."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Автоматично перечитувати панель, коли її тека змінюється на диску, не чекаючи Ctrl-R. Варто вимкнути на повільних мережевих дисках або у величезних теках."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "3D-вигляд підсвічує теки, у які записуються файли. Він стежить за кожною текою дерева, тож для величезних або мережевих дерев краще вимкнути."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "У робочому дереві git «Детальний вигляд» показує календар комітів вибраного елемента за рік. Щоразу запускається git log; для дуже великих репозиторіїв краще вимкнути."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "Команда, якою F4 редагує файли, наприклад vim або code --wait. Порожньо — $VISUAL або $EDITOR. Діє, лише коли «Використовувати внутрішній редактор» вимкнено."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "Команда, якою F3 переглядає файли, наприклад less або bat. Порожньо — $PAGER. Діє, лише коли «Використовувати внутрішній переглядач» вимкнено."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 відкриває власний переглядач Rat Commander, навіть якщо задано зовнішній. Він також використовується, коли зовнішній переглядач не налаштовано."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 відкриває власний редактор Rat Commander, навіть якщо задано зовнішній. Він також використовується, коли зовнішній редактор не налаштовано."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Показувати командний рядок оболонки під панелями. Без нього введення літери запускає швидкий пошук в активній панелі. Ctrl-F5 також його перемикає."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Програма, яку запускають командний рядок і Ctrl-O, наприклад /bin/zsh або pwsh, без аргументів. Порожньо — $SHELL (у Windows — оболонка, з якої запущено rc)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Скільки командних рядків запам'ятовується між сеансами (виклик через Alt-P, Alt-N і Alt-H). 0 вимикає історію; після зменшення найстаріші видаляються одразу."
"Ask before F8 deletes the selection or moves it to the trash." = "Запитувати, перш ніж F8 видалить виділене або перемістить його до смітника."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Запитувати, що робити, коли під час копіювання чи переміщення файл уже існує. Якщо вимкнено, файл замінюється без запитання."
"Ask before Enter runs a program or opens a file in its default application." = "Запитувати, перш ніж Enter запустить програму або відкриє файл у типовій програмі."
"Ask before the disk manager unmounts a filesystem." = "Запитувати перед відмонтуванням файлової системи в «Керуванні дисками»."
"Ask before F10 quits Rat Commander." = "Запитувати, перш ніж F10 закриє Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 переміщує локальні файли до смітника робочого столу, звідки їх можна відновити; Shift-F8 і далі видаляє остаточно. Якщо вимкнено, F8 теж видаляє назавжди."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "Мова меню, діалогів і повідомлень; змінюється одразу під час переміщення списком. Переклади — це файли в теці lang у каталозі конфігурації."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Формувати та впорядковувати арабський і перський текст для терміналів без підтримки bidi. Вимкніть у терміналах, які роблять це самі, як-от mlterm або Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Піксельна графіка для індикаторів прогресу, графіків, мініатюр і кнопок діалогів. Auto використовує Kitty, Sixel або iTerm2, якщо термінал їх підтримує; Off малює все текстом."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Використовувати 24-бітний колір, потрібний для градієнтів. Вимкніть, якщо кольори неправильні: імовірно, термінал підтримує лише 256 кольорів."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Завершувати рядки екрана стиранням замість пробілів, щоб текст, виділений мишею в терміналі, копіювався без кінцевих пробілів. Вимкніть, якщо фон розривається."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp і Ctrl-PgDn перемикають вкладки з будь-якого місця діалогу; ← і → перемикають їх, коли підсвічено рядок вкладок."
"Save the changes on every tab and close the dialog." = "Зберегти зміни на всіх вкладках і закрити діалог."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Закрити діалог, нічого не зберігаючи на жодній вкладці, і скасувати все, що застосовано для попереднього перегляду."

