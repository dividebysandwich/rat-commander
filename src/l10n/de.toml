# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Das Design der gesamten Oberfläche. Beim Blättern durch die Liste wird jedes sofort angezeigt; Optionen → Themes bearbeiten… ändert sie oder legt eigene an."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Lässt die animierten Farbverläufe eines Designs fließen. Benötigt Truecolor. Ausgeschaltet stehen sie still und sparen Neuzeichnen, hilfreich bei langsamen Remote-Verbindungen."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Zeigt in den Listen ein Symbol je Dateityp statt der Markierungen / * @. Erfordert eine Nerd Font als Schrift des Terminals, sonst erscheinen die Symbole als Kästchen."
"Show CPU and memory use at the right end of the menu bar." = "Zeigt CPU- und Speicherauslastung am rechten Ende der Menüleiste."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Wie lange ohne Tastendruck oder Mausbewegung, bis der Bildschirmschoner startet. Off startet ihn nie; der Befehl Bildschirmschoner starten in der Befehlspalette zeigt ihn sofort."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Welche Animation der Bildschirmschoner zeigt: Sternenfeld, Matrix-Regen, treibende Uhr oder wachsende Rohre. Random wählt jedes Mal eine andere."
"How many columns of file names the Brief view format puts side by side in a panel." = "Wie viele Spalten mit Dateinamen die Kurzansicht in einem Panel nebeneinander zeigt."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "Die Zellengröße der Ansicht Vorschaubilder: Small bringt die meisten Bilder auf den Bildschirm, Large zeigt die meisten Details."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Wie die 3D-Ansicht einen Baum zeichnet: Cubes, schattierte Quader an Ringen, oder Spare no expense, eine Landschaft im Stil von fsn mit Dateien, die nach Typ geformt sind."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Liest ein Panel selbst neu ein, wenn sich sein Verzeichnis auf dem Datenträger ändert, statt auf Ctrl-R zu warten. Bei langsamen Netzlaufwerken oder riesigen Verzeichnissen besser ausschalten."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "Lässt die 3D-Ansicht Verzeichnisse aufleuchten, während darin Dateien geschrieben werden. Überwacht jedes Verzeichnis im Baum, daher bei riesigen oder per Netzwerk eingehängten Bäumen ausschalten."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "In einem Git-Arbeitsverzeichnis zeigt die Detailansicht einen Kalender der Commits eines Jahres für das gewählte Element. Jeder Kalender startet git log; bei sehr großen Repositorys ausschalten."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "Der Befehl, mit dem F4 Dateien bearbeitet, etwa vim oder code --wait. Leer bedeutet $VISUAL oder $EDITOR. Gilt nur, solange Internen Editor verwenden aus ist."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "Der Befehl, mit dem F3 Dateien anzeigt, etwa less oder bat. Leer bedeutet $PAGER. Gilt nur, solange Internen Betrachter verwenden aus ist."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 öffnet den eigenen Betrachter von Rat Commander, auch wenn ein externer Betrachter eingestellt ist. Ist keiner eingestellt, wird er ohnehin verwendet."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 öffnet den eigenen Editor von Rat Commander, auch wenn ein externer Editor eingestellt ist. Ist keiner eingestellt, wird er ohnehin verwendet."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Zeigt die Shell-Befehlszeile unter den Panels. Ohne sie startet das Tippen eines Buchstabens eine Schnellsuche im aktiven Panel. Ctrl-F5 schaltet sie ebenfalls um."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Das Programm, das die Befehlszeile und Ctrl-O starten, etwa /bin/zsh oder pwsh, ohne Argumente. Leer bedeutet $SHELL (unter Windows die Shell, aus der rc gestartet wurde)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Wie viele Befehlszeilen sitzungsübergreifend gespeichert werden, abrufbar mit Alt-P, Alt-N und Alt-H. 0 schaltet den Verlauf ab; ein kleinerer Wert verwirft sofort die ältesten."
"Ask before F8 deletes the selection or moves it to the trash." = "Fragt nach, bevor F8 die Auswahl löscht oder in den Papierkorb verschiebt."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Fragt nach, was geschehen soll, wenn beim Kopieren oder Verschieben eine Datei schon existiert. Ausgeschaltet wird sie ohne Nachfrage ersetzt."
"Ask before Enter runs a program or opens a file in its default application." = "Fragt nach, bevor Enter ein Programm ausführt oder eine Datei in ihrer Standardanwendung öffnet."
"Ask before the disk manager unmounts a filesystem." = "Fragt nach, bevor die Datenträgerverwaltung ein Dateisystem aushängt."
"Ask before F10 quits Rat Commander." = "Fragt nach, bevor F10 Rat Commander beendet."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 verschiebt lokale Dateien in den Papierkorb des Desktops, wo sie wiederherstellbar sind; Shift-F8 löscht weiterhin endgültig. Ausgeschaltet löscht auch F8 endgültig."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "Die Sprache von Menüs, Dialogen und Meldungen, beim Blättern durch die Liste sofort sichtbar. Übersetzungen sind Dateien im Ordner lang des Konfigurationsverzeichnisses."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Formt arabischen und persischen Text für Terminals ohne Bidi-Unterstützung und ordnet ihn um. Bei Terminals, die das selbst tun, etwa mlterm oder Konsole, ausschalten."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Pixelgrafik für Fortschrittsbalken, Diagramme, Vorschaubilder und Dialogschaltflächen. Auto nutzt Kitty, Sixel oder iTerm2, falls das Terminal es kann; Off zeichnet sie als Text."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Nutzt 24-Bit-Farbe, die Verläufe benötigen. Ausschalten, wenn Farben falsch aussehen: Das Terminal kann dann vermutlich nur 256 Farben."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Beendet Bildschirmzeilen mit einem Löschbefehl statt Leerzeichen, damit mit der Terminal-Maus markierter Text ohne Leerzeichen am Ende kopiert wird. Ausschalten, wenn Hintergründe zerfallen."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp und Ctrl-PgDn wechseln von überall in diesem Dialog die Tabs; ← und → wechseln sie, solange die Tab-Leiste hervorgehoben ist."
"Save the changes on every tab and close the dialog." = "Speichert die Änderungen auf allen Tabs und schließt den Dialog."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Schließt den Dialog, ohne auf irgendeinem Tab etwas zu speichern, und macht die Live-Vorschauen rückgängig."

