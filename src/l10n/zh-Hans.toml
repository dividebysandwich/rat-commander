# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "整个界面的配色主题。在列表中移动时会实时预览；可通过“选项 → 编辑主题…”修改主题或添加自己的主题。"
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "让主题中的动画渐变色流动，需要 Truecolor。关闭后渐变保持静止并减少重绘，有助于在较慢的远程连接上使用。"
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "在列表中为每种文件类型显示图标，代替 / * @ 标记。终端字体须为 Nerd Font，否则图标会显示为方框。"
"Show CPU and memory use at the right end of the menu bar." = "在菜单栏右端显示 CPU 和内存占用。"
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "无按键或鼠标移动多长时间后启动屏幕保护程序。Off 表示从不启动；命令面板中的“启动屏幕保护程序”可立即启动。"
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "屏幕保护程序播放的动画：星空、矩阵字符雨、漂移的时钟或生长的管道。Random 每次随机选择一种。"
"How many columns of file names the Brief view format puts side by side in a panel." = "简略视图在一个面板中并排显示的文件名列数。"
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "缩略图视图的单元格大小：Small 可在屏幕上显示最多图片，Large 显示最多细节。"
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "3D 视图绘制树的方式：Cubes 为挂在圆环上的带阴影方块，Spare no expense 为 fsn 风格的地形，文件形状随类型而异。"
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "目录在磁盘上发生变化时自动重新读取面板，无需等待 Ctrl-R。在较慢的网络挂载或超大目录上建议关闭。"
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "有文件写入时，在 3D 视图中点亮对应的目录。此功能会监视树中的每个目录，因此超大或网络挂载的树请关闭。"
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "在 git 工作树中，详细视图会以日历显示所选项目一年内的提交。每次都会运行 git log，非常大的仓库请关闭此项。"
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "F4 编辑文件时使用的命令，例如 vim 或 code --wait。留空则使用 $VISUAL 或 $EDITOR。仅在“使用内置编辑器”关闭时生效。"
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "F3 查看文件时使用的命令，例如 less 或 bat。留空则使用 $PAGER。仅在“使用内置查看器”关闭时生效。"
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "即使设置了外部查看器，F3 也会打开 Rat Commander 自带的查看器。未配置外部查看器时也总是使用它。"
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "即使设置了外部编辑器，F4 也会打开 Rat Commander 自带的编辑器。未配置外部编辑器时也总是使用它。"
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "在面板下方显示外壳命令行。隐藏时，输入字母会在当前面板中开始快速搜索。也可用 Ctrl-F5 切换。"
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "命令行和 Ctrl-O 运行的程序，例如 /bin/zsh 或 pwsh，不带参数。留空则使用 $SHELL（在 Windows 上为启动 rc 的外壳）。"
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "跨会话记住的命令行条数，可用 Alt-P、Alt-N 和 Alt-H 调出。0 表示关闭历史记录；调小后会立即丢弃最旧的条目。"
"Ask before F8 deletes the selection or moves it to the trash." = "F8 删除所选项目或将其移到回收站前询问。"
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "复制或移动时遇到已存在的文件，询问如何处理。关闭后直接覆盖，不再询问。"
"Ask before Enter runs a program or opens a file in its default application." = "按 Enter 运行程序或用默认应用程序打开文件前询问。"
"Ask before the disk manager unmounts a filesystem." = "磁盘管理器卸载文件系统前询问。"
"Ask before F10 quits Rat Commander." = "按 F10 退出 Rat Commander 前询问。"
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 将本地文件移到桌面回收站，之后可以还原；Shift-F8 仍会永久删除。关闭后 F8 也会永久删除。"
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "菜单、对话框和消息使用的语言，在列表中移动时实时预览。翻译文件位于配置目录的 lang 文件夹中。"
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "为不支持 bidi 的终端对阿拉伯文和波斯文进行字形重塑和重新排序。在自行处理的终端（如 mlterm 或 Konsole）上请关闭。"
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "用于进度条、图表、缩略图和对话框按钮的像素图形。Auto 会在终端支持时使用 Kitty、Sixel 或 iTerm2；Off 则以文本绘制。"
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "使用 24-bit 色彩，渐变需要此项。颜色显示异常时请关闭：终端可能只支持 256 色。"
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "屏幕行末用擦除代替空格结束，这样用终端鼠标选中的文本复制时不带行尾空白。如果背景出现断裂请关闭。"
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "在此对话框中任意位置按 Ctrl-PgUp 和 Ctrl-PgDn 可切换标签页；标签栏高亮时，← 和 → 也可切换。"
"Save the changes on every tab and close the dialog." = "保存所有标签页上的更改并关闭对话框。"
"Close the dialog without saving anything on any tab, and undo the live previews." = "关闭对话框，不保存任何标签页上的更改，并撤销实时预览。"

