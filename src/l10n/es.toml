# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "El tema de colores de toda la interfaz. Al recorrer la lista se previsualiza cada uno en vivo; Opciones → Editar temas… los modifica o añade los suyos."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Hace fluir los degradados de color animados de un tema. Requiere Truecolor. Desactivado, quedan quietos y ahorran redibujados, lo que ayuda en una conexión remota lenta."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Muestra un icono por tipo de archivo en los listados en lugar de los marcadores / * @. Requiere una Nerd Font como fuente de la terminal; si no, los iconos se ven como cuadros."
"Show CPU and memory use at the right end of the menu bar." = "Muestra el uso de CPU y memoria en el extremo derecho de la barra de menús."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Tiempo sin pulsar teclas ni mover el ratón antes de que se inicie el salvapantallas. Off no lo inicia nunca; Iniciar salvapantallas en la paleta de comandos lo muestra ya."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Qué animación reproduce el salvapantallas: un campo de estrellas, lluvia de Matrix, un reloj a la deriva o tuberías que crecen. Random elige una distinta cada vez."
"How many columns of file names the Brief view format puts side by side in a panel." = "Cuántas columnas de nombres de archivo coloca la vista breve una junto a otra en un panel."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "El tamaño de celda de la vista de miniaturas: Small muestra más imágenes en pantalla, Large muestra más detalle."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Cómo dibuja la vista 3D un árbol: Cubes, cajas sombreadas colgadas de anillos, o Spare no expense, un paisaje al estilo de fsn con archivos con forma según su tipo."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Relee un panel por sí solo cuando su directorio cambia en disco, sin esperar a Ctrl-R. Conviene desactivarlo en montajes de red lentos o directorios enormes."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "Hace que la vista 3D ilumine los directorios donde se escriben archivos. Vigila todos los directorios del árbol, así que desactívelo en árboles enormes o montados en red."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "En un árbol de trabajo de git, la vista detallada muestra un calendario con los commits de un año del elemento seleccionado. Cada uno ejecuta git log; desactívelo en repositorios muy grandes."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "La orden con la que F4 edita archivos, como vim o code --wait. Vacío usa $VISUAL o $EDITOR. Solo se usa mientras Usar el editor interno esté desactivado."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "La orden con la que F3 muestra archivos, como less o bat. Vacío usa $PAGER. Solo se usa mientras Usar el visor interno esté desactivado."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 abre el visor propio de Rat Commander aunque haya un visor externo configurado. También se usa siempre que no haya ningún visor externo configurado."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 abre el editor propio de Rat Commander aunque haya un editor externo configurado. También se usa siempre que no haya ningún editor externo configurado."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Muestra la línea de órdenes del shell bajo los paneles. Sin ella, teclear una letra inicia una búsqueda rápida en el panel activo. Ctrl-F5 también la muestra u oculta."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "El programa que ejecutan la línea de órdenes y Ctrl-O, como /bin/zsh o pwsh, sin argumentos. Vacío usa $SHELL (en Windows, el shell desde el que se inició rc)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Cuántas líneas de órdenes se recuerdan entre sesiones, recuperables con Alt-P, Alt-N y Alt-H. 0 desactiva el historial; reducirlo descarta al instante las más antiguas."
"Ask before F8 deletes the selection or moves it to the trash." = "Pregunta antes de que F8 elimine la selección o la mueva a la papelera."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Pregunta qué hacer cuando al copiar o mover ya existe el archivo de destino. Desactivado, lo reemplaza sin preguntar."
"Ask before Enter runs a program or opens a file in its default application." = "Pregunta antes de que Enter ejecute un programa o abra un archivo en su aplicación predeterminada."
"Ask before the disk manager unmounts a filesystem." = "Pregunta antes de que el administrador de discos desmonte un sistema de archivos."
"Ask before F10 quits Rat Commander." = "Pregunta antes de que F10 cierre Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 mueve los archivos locales a la papelera del escritorio, donde se pueden restaurar; Shift-F8 sigue borrando para siempre. Desactivado, F8 también borra de forma permanente."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "El idioma de menús, diálogos y mensajes, previsualizado en vivo al recorrer la lista. Las traducciones son archivos de la carpeta lang del directorio de configuración."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Da forma y reordena el texto árabe y persa para terminales sin soporte bidi. Desactívelo en terminales que ya lo hacen por sí mismas, como mlterm o Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Gráficos de píxeles para barras de progreso, gráficas, miniaturas y botones de diálogo. Auto usa Kitty, Sixel o iTerm2 si la terminal lo admite; Off los dibuja como texto."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Usa color de 24 bits, necesario para los degradados. Desactívelo si los colores se ven mal: probablemente la terminal solo admite 256 colores."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Termina las filas de pantalla con un borrado en vez de espacios, para que el texto seleccionado con el ratón de la terminal se copie sin espacios finales. Desactívelo si los fondos se cortan."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp y Ctrl-PgDn cambian de pestaña desde cualquier parte de este diálogo; ← y → lo hacen mientras la fila de pestañas está resaltada."
"Save the changes on every tab and close the dialog." = "Guarda los cambios de todas las pestañas y cierra el diálogo."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Cierra el diálogo sin guardar nada en ninguna pestaña y deshace las previsualizaciones en vivo."

