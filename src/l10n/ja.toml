# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "インターフェース全体の配色テーマです。一覧を移動すると各テーマをその場でプレビューします。オプション → テーマを編集… で変更や独自テーマの追加ができます。"
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "テーマのアニメーション付きグラデーションを動かします。Truecolor が必要です。オフにすると静止して再描画が減り、低速なリモート接続で役立ちます。"
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "一覧で / * @ 記号の代わりにファイルの種類ごとのアイコンを表示します。端末のフォントに Nerd Font が必要で、ないとアイコンが四角で表示されます。"
"Show CPU and memory use at the right end of the menu bar." = "メニューバーの右端に CPU とメモリの使用率を表示します。"
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "キー入力やマウス操作がないまま、スクリーンセーバーが始まるまでの時間です。Off では起動しません。コマンドパレットの「スクリーンセーバーを開始」ですぐに表示できます。"
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "スクリーンセーバーで再生するアニメーション（星空、マトリックス風の雨、漂う時計、伸びるパイプ）です。Random では毎回異なるものを選びます。"
"How many columns of file names the Brief view format puts side by side in a panel." = "簡易表示で 1 つのパネルに並べるファイル名の列数です。"
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "サムネイル表示のセルの大きさです。Small は画面に最も多くの画像を並べ、Large は最も細かく表示します。"
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "3D 表示でのツリーの描き方です。Cubes はリングに吊るされた陰影付きの箱、Spare no expense はファイルの種類で形が変わる fsn 風の風景です。"
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "ディスク上でディレクトリが変わると、Ctrl-R を待たずにパネルを自動で再読み込みします。低速なネットワークマウントや巨大なディレクトリではオフを検討してください。"
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "ファイルが書き込まれたディレクトリを 3D 表示で光らせます。ツリー内のすべてのディレクトリを監視するため、巨大なツリーやネットワークマウントではオフにしてください。"
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "git の作業ツリーでは、情報表示に選択中の項目の 1 年分のコミットをカレンダーで表示します。そのたびに git log を実行するため、非常に大きなリポジトリではオフにしてください。"
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "F4 でファイルを編集するコマンド（vim、code --wait など）です。空欄なら $VISUAL か $EDITOR を使います。「内蔵エディタを使う」がオフのときだけ使われます。"
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "F3 でファイルを表示するコマンド（less、bat など）です。空欄なら $PAGER を使います。「内蔵ビューアを使う」がオフのときだけ使われます。"
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "外部ビューアが設定されていても、F3 で Rat Commander 内蔵のビューアを開きます。外部ビューアが未設定のときも常にこちらを使います。"
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "外部エディタが設定されていても、F4 で Rat Commander 内蔵のエディタを開きます。外部エディタが未設定のときも常にこちらを使います。"
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "パネルの下にシェルのコマンドラインを表示します。非表示のときは、文字を入力するとアクティブなパネルでクイック検索が始まります。Ctrl-F5 でも切り替えられます。"
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "コマンドラインと Ctrl-O で実行するプログラム（/bin/zsh、pwsh など。引数なし）です。空欄なら $SHELL を使います（Windows では rc を起動したシェル）。"
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "セッションをまたいで記憶するコマンドラインの件数です。Alt-P、Alt-N、Alt-H で呼び出せます。0 で履歴をオフにし、減らすと古いものからすぐに削除します。"
"Ask before F8 deletes the selection or moves it to the trash." = "F8 で選択項目を削除する、またはごみ箱へ移動する前に確認します。"
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "コピーや移動で既存のファイルと重なったとき、どうするか確認します。オフにすると確認せずに上書きします。"
"Ask before Enter runs a program or opens a file in its default application." = "Enter でプログラムを実行したり、ファイルを既定のアプリケーションで開いたりする前に確認します。"
"Ask before the disk manager unmounts a filesystem." = "ディスク管理でファイルシステムをアンマウントする前に確認します。"
"Ask before F10 quits Rat Commander." = "F10 で Rat Commander を終了する前に確認します。"
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 でローカルのファイルをデスクトップのごみ箱へ移動し、後で復元できるようにします。Shift-F8 は引き続き完全に削除します。オフにすると F8 でも完全に削除します。"
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "メニュー、ダイアログ、メッセージの言語です。一覧を移動するとその場でプレビューします。翻訳は設定ディレクトリの lang フォルダにあるファイルです。"
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "bidi 非対応の端末向けに、アラビア語とペルシア語のテキストを字形整形して並べ替えます。mlterm や Konsole など自前で処理する端末ではオフにしてください。"
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "進捗バー、グラフ、サムネイル、ダイアログのボタンに使うピクセルグラフィックスです。Auto は端末が対応していれば Kitty、Sixel、iTerm2 を使い、Off ではテキストで描画します。"
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "グラデーションに必要な 24-bit カラーを使います。色がおかしい場合はオフにしてください。端末が 256 色にしか対応していない可能性があります。"
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "画面の行末を空白ではなく消去で終え、端末のマウスで選択したテキストを行末の空白なしでコピーできるようにします。背景が途切れる場合はオフにしてください。"
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp と Ctrl-PgDn でダイアログ内のどこからでもタブを切り替えられます。タブ行が強調表示されているときは ← と → でも切り替えられます。"
"Save the changes on every tab and close the dialog." = "すべてのタブの変更を保存してダイアログを閉じます。"
"Close the dialog without saving anything on any tab, and undo the live previews." = "どのタブの変更も保存せずにダイアログを閉じ、プレビューした内容を元に戻します。"

