# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "O tema de cores de toda a interface. Percorrer a lista pré-visualiza cada um em direto; Opções → Editar temas… altera-os ou adiciona os seus."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Faz fluir os gradientes de cor animados de um tema. Requer Truecolor. Desligado, ficam parados e poupam redesenhos, o que ajuda numa ligação remota lenta."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Mostra um ícone por tipo de ficheiro nas listagens em vez dos marcadores / * @. Requer uma Nerd Font como tipo de letra do terminal, senão os ícones aparecem como caixas."
"Show CPU and memory use at the right end of the menu bar." = "Mostra o uso de CPU e memória na ponta direita da barra de menus."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Tempo sem premir teclas nem mexer o rato até o protetor de tela arrancar. Off nunca o inicia; Iniciar protetor de tela na paleta de comandos mostra-o de imediato."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Que animação o protetor de tela reproduz: um campo de estrelas, chuva à Matrix, um relógio à deriva ou canos a crescer. Random escolhe uma diferente de cada vez."
"How many columns of file names the Brief view format puts side by side in a panel." = "Quantas colunas de nomes de ficheiros a vista breve coloca lado a lado num painel."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "O tamanho das células da vista de miniaturas: Small mostra mais imagens no ecrã, Large mostra mais detalhe."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Como a vista 3D desenha uma árvore: Cubes, caixas sombreadas penduradas em anéis, ou Spare no expense, uma paisagem ao estilo do fsn com ficheiros moldados pelo tipo."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Relê um painel sozinho quando o seu diretório muda no disco, sem esperar por Ctrl-R. Convém desligar em montagens de rede lentas ou diretórios enormes."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "Faz a vista 3D iluminar os diretórios à medida que se escrevem ficheiros neles. Vigia todos os diretórios da árvore, por isso desligue-a em árvores enormes ou montadas em rede."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "Numa árvore de trabalho git, a vista detalhada mostra um calendário dos commits de um ano do item selecionado. Cada um executa git log; desligue-a em repositórios muito grandes."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "O comando com que F4 edita ficheiros, como vim ou code --wait. Vazio usa $VISUAL ou $EDITOR. Só é usado enquanto Usar o editor interno estiver desligado."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "O comando com que F3 mostra ficheiros, como less ou bat. Vazio usa $PAGER. Só é usado enquanto Usar o visualizador interno estiver desligado."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 abre o visualizador do próprio Rat Commander mesmo com um visualizador externo definido. Também é usado sempre que não há visualizador externo configurado."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 abre o editor do próprio Rat Commander mesmo com um editor externo definido. Também é usado sempre que não há editor externo configurado."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Mostra a linha de comandos do shell por baixo dos painéis. Sem ela, escrever uma letra inicia uma pesquisa rápida no painel ativo. Ctrl-F5 também a mostra ou oculta."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "O programa que a linha de comandos e Ctrl-O executam, como /bin/zsh ou pwsh, sem argumentos. Vazio usa $SHELL (no Windows, o shell a partir do qual o rc foi iniciado)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Quantas linhas de comando são lembradas entre sessões, recuperadas com Alt-P, Alt-N e Alt-H. 0 desliga o histórico; reduzi-lo descarta de imediato as mais antigas."
"Ask before F8 deletes the selection or moves it to the trash." = "Pergunta antes de F8 eliminar a seleção ou movê-la para a reciclagem."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Pergunta o que fazer quando uma cópia ou movimentação encontra um ficheiro que já existe. Desligado, substitui-o sem perguntar."
"Ask before Enter runs a program or opens a file in its default application." = "Pergunta antes de Enter executar um programa ou abrir um ficheiro na sua aplicação predefinida."
"Ask before the disk manager unmounts a filesystem." = "Pergunta antes de o gestor de discos desmontar um sistema de ficheiros."
"Ask before F10 quits Rat Commander." = "Pergunta antes de F10 sair do Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 move ficheiros locais para a reciclagem do ambiente de trabalho, onde podem ser restaurados; Shift-F8 continua a eliminar de vez. Desligado, F8 também elimina permanentemente."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "O idioma dos menus, diálogos e mensagens, pré-visualizado em direto ao percorrer a lista. As traduções são ficheiros na pasta lang do diretório de configuração."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Molda e reordena texto árabe e persa para terminais sem suporte bidi. Desligue-o em terminais que já o fazem sozinhos, como mlterm ou Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Gráficos em píxeis para barras de progresso, diagramas, miniaturas e botões de diálogo. Auto usa Kitty, Sixel ou iTerm2 se o terminal os suportar; Off desenha-os em texto."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Usa cor de 24 bits, necessária para os gradientes. Desligue-a se as cores parecerem erradas: o terminal provavelmente só suporta 256 cores."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Termina as linhas do ecrã com um apagamento em vez de espaços, para que texto selecionado com o rato do terminal seja copiado sem espaços finais. Desligue-a se os fundos se partirem."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp e Ctrl-PgDn mudam de separador em qualquer ponto desta caixa de diálogo; ← e → fazem-no enquanto a linha de separadores está realçada."
"Save the changes on every tab and close the dialog." = "Guarda as alterações de todos os separadores e fecha a caixa de diálogo."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Fecha a caixa de diálogo sem guardar nada em nenhum separador e desfaz as pré-visualizações em direto."

