# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "پوستهٔ رنگی کل رابط. با حرکت در فهرست، هر پوسته زنده پیش‌نمایش می‌شود؛ با گزینه‌ها → ویرایش پوسته‌ها… می‌توانید آن‌ها را تغییر دهید یا پوستهٔ خودتان را بیفزایید."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "گرادیان‌های رنگی متحرک پوسته را روان می‌کند. به Truecolor نیاز دارد. اگر خاموش باشد ثابت می‌مانند و بازترسیم کمتر می‌شود که روی اتصال راه دور کند مفید است."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "به‌جای نشانه‌های / * @ برای هر نوع پرونده در فهرست‌ها یک نماد نشان می‌دهد. قلم پایانه باید یک Nerd Font باشد، وگرنه نمادها به شکل مربع دیده می‌شوند."
"Show CPU and memory use at the right end of the menu bar." = "مصرف پردازنده و حافظه را در انتهای سمت راست نوار منو نشان می‌دهد."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "مدت بی‌کاری (بدون فشردن کلید یا حرکت موشواره) پیش از شروع محافظ صفحه. گزینهٔ Off هرگز آن را اجرا نمی‌کند؛ اجرای محافظ صفحه در پالت فرمان همین حالا آن را نشان می‌دهد."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "انیمیشنی که محافظ صفحه پخش می‌کند: میدان ستارگان، باران ماتریکس، ساعت شناور یا لوله‌های در حال رشد. گزینهٔ Random هر بار یکی دیگر را برمی‌گزیند."
"How many columns of file names the Brief view format puts side by side in a panel." = "تعداد ستون‌های نام پرونده که نمای مختصر در هر پنل کنار هم می‌چیند."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "اندازهٔ خانه‌ها در نمای تصاویر بندانگشتی: Small بیشترین تعداد تصویر را روی صفحه جا می‌دهد و Large بیشترین جزئیات را نشان می‌دهد."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "شیوهٔ ترسیم درخت در نمای 3D: گزینهٔ Cubes، جعبه‌های سایه‌دار آویخته از حلقه‌ها، یا گزینهٔ Spare no expense، چشم‌اندازی به سبک fsn که شکل پرونده‌ها به نوعشان بستگی دارد."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "وقتی پوشهٔ یک پنل روی دیسک تغییر کند، پنل خودش بازخوانی می‌شود و لازم نیست منتظر Ctrl-R بمانید. برای مانت‌های کند شبکه یا پوشه‌های بسیار بزرگ بهتر است خاموش باشد."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "نمای 3D پوشه‌ها را هنگام نوشته شدن پرونده در آن‌ها روشن می‌کند. همهٔ پوشه‌های درخت پایش می‌شوند، پس برای درخت‌های بسیار بزرگ یا مانت‌شده از شبکه خاموشش کنید."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "در یک درخت کاری git، نمای جزئیات تقویم کامیت‌های یک سال را برای مورد انتخاب‌شده نشان می‌دهد. هر بار git log اجرا می‌شود؛ برای مخزن‌های بسیار بزرگ خاموشش کنید."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "فرمانی که F4 پرونده‌ها را با آن ویرایش می‌کند، مانند vim یا code --wait. اگر خالی باشد از $VISUAL یا $EDITOR استفاده می‌شود. فقط وقتی به کار می‌رود که استفاده از ویرایشگر داخلی خاموش باشد."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "فرمانی که F3 پرونده‌ها را با آن نمایش می‌دهد، مانند less یا bat. اگر خالی باشد از $PAGER استفاده می‌شود. فقط وقتی به کار می‌رود که استفاده از نمایشگر داخلی خاموش باشد."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "کلید F3 نمایشگر خود Rat Commander را باز می‌کند، حتی اگر نمایشگر خارجی تنظیم شده باشد. وقتی هیچ نمایشگر خارجی پیکربندی نشده باشد هم همین به کار می‌رود."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "کلید F4 ویرایشگر خود Rat Commander را باز می‌کند، حتی اگر ویرایشگر خارجی تنظیم شده باشد. وقتی هیچ ویرایشگر خارجی پیکربندی نشده باشد هم همین به کار می‌رود."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "خط فرمان پوسته را زیر پنل‌ها نشان می‌دهد. بدون آن، تایپ یک حرف جستجوی سریع را در پنل فعال آغاز می‌کند. کلید Ctrl-F5 هم آن را روشن و خاموش می‌کند."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "برنامه‌ای که خط فرمان و Ctrl-O بدون آرگومان اجرا می‌کنند، مانند /bin/zsh یا pwsh. اگر خالی باشد $SHELL به کار می‌رود (در Windows، پوسته‌ای که rc از آن اجرا شده است)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "تعداد خطوط فرمانی که میان نشست‌ها به خاطر سپرده می‌شوند و با Alt-P، Alt-N و Alt-H فراخوانی می‌شوند. 0 تاریخچه را خاموش می‌کند؛ کاهش آن قدیمی‌ترین‌ها را فوراً حذف می‌کند."
"Ask before F8 deletes the selection or moves it to the trash." = "پیش از آنکه F8 موارد انتخاب‌شده را حذف کند یا به زباله‌دان منتقل کند، سؤال می‌کند."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "وقتی کپی یا انتقال به پرونده‌ای برمی‌خورد که از قبل وجود دارد، می‌پرسد چه کار شود. اگر خاموش باشد، بدون پرسش بازنویسی می‌شود."
"Ask before Enter runs a program or opens a file in its default application." = "پیش از آنکه Enter برنامه‌ای را اجرا کند یا پرونده‌ای را در برنامهٔ پیش‌فرضش باز کند، سؤال می‌کند."
"Ask before the disk manager unmounts a filesystem." = "پیش از آنکه مدیریت دیسک یک سامانهٔ پرونده را جدا کند، سؤال می‌کند."
"Ask before F10 quits Rat Commander." = "پیش از آنکه F10 از Rat Commander خارج شود، سؤال می‌کند."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "کلید F8 پرونده‌های محلی را به زباله‌دان میزکار می‌فرستد تا قابل بازیابی باشند؛ Shift-F8 همچنان برای همیشه حذف می‌کند. اگر خاموش باشد، F8 هم برای همیشه حذف می‌کند."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "زبان منوها، کادرهای گفتگو و پیام‌ها، با پیش‌نمایش زنده هنگام حرکت در فهرست. ترجمه‌ها پرونده‌هایی در پوشهٔ lang درون پوشهٔ پیکربندی هستند."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "متن عربی و فارسی را برای پایانه‌های بدون پشتیبانی از نمایش دوسویه شکل‌دهی و بازچینی می‌کند. در پایانه‌هایی که خودشان این کار را می‌کنند، مانند mlterm یا Konsole، خاموشش کنید."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "گرافیک پیکسلی برای نوارهای پیشرفت، نمودارها، تصاویر بندانگشتی و دکمه‌های کادر گفتگو. گزینهٔ Auto اگر پایانه Kitty، Sixel یا iTerm2 داشته باشد از آن استفاده می‌کند؛ Off آن‌ها را متنی رسم می‌کند."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "از رنگ 24-bit استفاده می‌کند که گرادیان‌ها به آن نیاز دارند. اگر رنگ‌ها نادرست به نظر می‌رسند خاموشش کنید؛ احتمالاً پایانه فقط 256 رنگ را پشتیبانی می‌کند."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "انتهای ردیف‌های صفحه را به‌جای فاصله با پاک‌سازی پر می‌کند تا متنی که با موشوارهٔ پایانه انتخاب می‌شود بدون فاصله‌های انتهایی کپی شود. اگر پس‌زمینه‌ها تکه‌تکه شدند خاموشش کنید."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "کلیدهای Ctrl-PgUp و Ctrl-PgDn از هر جای این کادر گفتگو زبانه را عوض می‌کنند؛ وقتی ردیف زبانه‌ها برجسته است، ← و → هم زبانه را عوض می‌کنند."
"Save the changes on every tab and close the dialog." = "تغییرات همهٔ زبانه‌ها را ذخیره می‌کند و کادر گفتگو را می‌بندد."
"Close the dialog without saving anything on any tab, and undo the live previews." = "کادر گفتگو را بدون ذخیرهٔ هیچ چیز در هیچ زبانه‌ای می‌بندد و پیش‌نمایش‌های زنده را لغو می‌کند."

