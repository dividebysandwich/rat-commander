# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Цветовая тема всего интерфейса. При перемещении по списку каждая тема сразу видна в действии; Опции → Изменить темы… позволяет изменить их или добавить свои."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Плавная анимация цветовых градиентов темы. Нужен Truecolor. Если выключено, градиенты неподвижны и экран реже перерисовывается — это помогает при медленном удалённом соединении."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Показывать в списках значок типа файла вместо меток / * @. Шрифтом терминала должен быть Nerd Font, иначе вместо значков будут квадратики."
"Show CPU and memory use at the right end of the menu bar." = "Показывать загрузку процессора и памяти в правой части строки меню."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Сколько времени без нажатий клавиш и движений мыши должно пройти до запуска заставки. Off — не запускать; «Запустить заставку» в палитре команд покажет её сразу."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Какую анимацию показывает заставка: звёздное поле, дождь из «Матрицы», плывущие часы или растущие трубы. Random каждый раз выбирает другую."
"How many columns of file names the Brief view format puts side by side in a panel." = "Сколько столбцов с именами файлов «Краткий вид» размещает рядом на панели."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "Размер ячейки в режиме «Миниатюры»: Small вмещает на экран больше всего изображений, Large показывает больше всего деталей."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Как 3D-вид рисует дерево: Cubes — затенённые блоки, висящие на кольцах, или Spare no expense — ландшафт в стиле fsn, где форма файла зависит от его типа."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Перечитывать панель автоматически, когда её каталог меняется на диске, не дожидаясь Ctrl-R. Стоит выключить на медленных сетевых дисках или в огромных каталогах."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "3D-вид подсвечивает каталоги, в которые записываются файлы. Он следит за каждым каталогом дерева, поэтому для огромных или сетевых деревьев лучше выключить."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "В рабочем дереве git «Подробный вид» показывает календарь коммитов выбранного элемента за год. Каждый раз запускается git log; для очень больших репозиториев лучше выключить."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "Команда, которой F4 редактирует файлы, например vim или code --wait. Пусто — $VISUAL или $EDITOR. Применяется, только если «Использовать встроенный редактор» выключено."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "Команда, которой F3 просматривает файлы, например less или bat. Пусто — $PAGER. Применяется, только если «Использовать встроенный просмотрщик» выключено."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 открывает собственный просмотрщик Rat Commander, даже если задан внешний. Он также используется, когда внешний просмотрщик не настроен."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 открывает собственный редактор Rat Commander, даже если задан внешний. Он также используется, когда внешний редактор не настроен."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Показывать командную строку оболочки под панелями. Без неё ввод буквы запускает быстрый поиск в активной панели. Ctrl-F5 тоже её переключает."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Программа, которую запускают командная строка и Ctrl-O, например /bin/zsh или pwsh, без аргументов. Пусто — $SHELL (в Windows — оболочка, из которой запущен rc)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Сколько командных строк запоминается между сеансами (вызов через Alt-P, Alt-N и Alt-H). 0 отключает историю; при уменьшении самые старые удаляются сразу."
"Ask before F8 deletes the selection or moves it to the trash." = "Спрашивать, прежде чем F8 удалит выделенное или переместит его в корзину."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Спрашивать, что делать, если при копировании или перемещении файл уже существует. Если выключено, файл заменяется без вопросов."
"Ask before Enter runs a program or opens a file in its default application." = "Спрашивать, прежде чем Enter запустит программу или откроет файл в приложении по умолчанию."
"Ask before the disk manager unmounts a filesystem." = "Спрашивать, прежде чем диспетчер дисков отмонтирует файловую систему."
"Ask before F10 quits Rat Commander." = "Спрашивать, прежде чем F10 закроет Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 перемещает локальные файлы в корзину рабочего стола, откуда их можно восстановить; Shift-F8 по-прежнему удаляет безвозвратно. Если выключено, F8 тоже удаляет навсегда."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "Язык меню, диалогов и сообщений; сразу меняется при перемещении по списку. Переводы — это файлы в папке lang каталога конфигурации."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Формировать и переупорядочивать арабский и персидский текст для терминалов без поддержки bidi. Выключите в терминалах, которые делают это сами, например mlterm или Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Пиксельная графика для индикаторов прогресса, графиков, миниатюр и кнопок диалогов. Auto использует Kitty, Sixel или iTerm2, если терминал их поддерживает; Off рисует всё текстом."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Использовать 24-битный цвет, нужный для градиентов. Выключите, если цвета искажены: вероятно, терминал поддерживает только 256 цветов."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Завершать строки экрана стиранием вместо пробелов, чтобы текст, выделенный мышью в терминале, копировался без концевых пробелов. Выключите, если фон разрывается."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp и Ctrl-PgDn переключают вкладки из любого места диалога; ← и → переключают их, когда подсвечена строка вкладок."
"Save the changes on every tab and close the dialog." = "Сохранить изменения на всех вкладках и закрыть диалог."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Закрыть диалог, ничего не сохраняя ни на одной вкладке, и отменить всё, что было применено для предпросмотра."

