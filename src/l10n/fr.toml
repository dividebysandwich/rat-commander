# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Le thème de couleurs de toute l'interface. Parcourir la liste prévisualise chaque thème en direct ; Options → Éditer les thèmes… les modifie ou ajoute les vôtres."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Anime les dégradés de couleurs d'un thème. Nécessite Truecolor. Désactivé, ils restent figés et évitent des rafraîchissements, utile sur une connexion distante lente."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Affiche une icône par type de fichier dans les listes au lieu des marqueurs / * @. Nécessite une Nerd Font comme police du terminal, sinon les icônes s'affichent en carrés."
"Show CPU and memory use at the right end of the menu bar." = "Affiche l'utilisation du CPU et de la mémoire à droite de la barre de menus."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Délai sans touche ni mouvement de souris avant le démarrage de l'économiseur d'écran. Off ne le lance jamais ; Lancer l'économiseur d'écran dans la palette de commandes le lance tout de suite."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "L'animation jouée par l'économiseur d'écran : champ d'étoiles, pluie façon Matrix, horloge flottante ou tuyaux qui poussent. Random en choisit une différente à chaque fois."
"How many columns of file names the Brief view format puts side by side in a panel." = "Nombre de colonnes de noms de fichiers que la vue résumée place côte à côte dans un panneau."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "La taille des cellules de la vue en vignettes : Small affiche le plus d'images à l'écran, Large montre le plus de détails."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Le rendu d'un arbre dans la vue 3D : Cubes, des blocs ombrés suspendus à des anneaux, ou Spare no expense, un paysage façon fsn aux fichiers formés selon leur type."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Relit un panneau de lui-même quand son répertoire change sur le disque, sans attendre Ctrl-R. À désactiver sur les montages réseau lents ou les très gros répertoires."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "La vue 3D illumine les répertoires où des fichiers sont écrits. Elle surveille chaque répertoire de l'arbre : désactivez-la pour les arbres énormes ou montés en réseau."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "Dans un arbre de travail git, la vue détaillée affiche un calendrier des commits d'une année pour l'élément sélectionné. Chacun lance git log ; désactivez-la pour les très gros dépôts."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "La commande avec laquelle F4 édite les fichiers, comme vim ou code --wait. Vide utilise $VISUAL ou $EDITOR. Sert seulement si Utiliser l'éditeur interne est désactivé."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "La commande avec laquelle F3 affiche les fichiers, comme less ou bat. Vide utilise $PAGER. Sert seulement si Utiliser la visionneuse interne est désactivé."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 ouvre la visionneuse de Rat Commander même si une visionneuse externe est définie. Elle sert aussi dès qu'aucune visionneuse externe n'est configurée."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 ouvre l'éditeur de Rat Commander même si un éditeur externe est défini. Il sert aussi dès qu'aucun éditeur externe n'est configuré."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Affiche la ligne de commande du shell sous les panneaux. Sans elle, taper une lettre lance une recherche rapide dans le panneau actif. Ctrl-F5 l'affiche ou la masque aussi."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Le programme lancé par la ligne de commande et Ctrl-O, comme /bin/zsh ou pwsh, sans arguments. Vide utilise $SHELL (sous Windows, le shell depuis lequel rc a été lancé)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Nombre de lignes de commande mémorisées entre les sessions, rappelées par Alt-P, Alt-N et Alt-H. 0 désactive l'historique ; le réduire supprime aussitôt les plus anciennes."
"Ask before F8 deletes the selection or moves it to the trash." = "Demande confirmation avant que F8 supprime la sélection ou la mette à la corbeille."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Demande quoi faire quand une copie ou un déplacement rencontre un fichier existant. Désactivé, le fichier est remplacé sans demander."
"Ask before Enter runs a program or opens a file in its default application." = "Demande confirmation avant que Enter lance un programme ou ouvre un fichier dans son application par défaut."
"Ask before the disk manager unmounts a filesystem." = "Demande confirmation avant que le gestionnaire de disques démonte un système de fichiers."
"Ask before F10 quits Rat Commander." = "Demande confirmation avant que F10 quitte Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 déplace les fichiers locaux vers la corbeille du bureau, où ils peuvent être restaurés ; Shift-F8 supprime toujours définitivement. Désactivé, F8 supprime aussi définitivement."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "La langue des menus, dialogues et messages, prévisualisée en direct en parcourant la liste. Les traductions sont des fichiers du dossier lang du répertoire de configuration."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Met en forme et réordonne le texte arabe et persan pour les terminaux sans prise en charge bidi. Désactivez-le sur les terminaux qui le font eux-mêmes, comme mlterm ou Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Graphismes en pixels pour barres de progression, graphiques, vignettes et boutons de dialogue. Auto utilise Kitty, Sixel ou iTerm2 si le terminal en dispose ; Off les dessine en texte."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Utilise la couleur 24 bits, nécessaire aux dégradés. Désactivez-la si les couleurs semblent fausses : le terminal ne gère sans doute que 256 couleurs."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Termine les lignes de l'écran par un effacement plutôt que des espaces : le texte sélectionné à la souris du terminal se copie sans espaces de fin. Désactivez-le si les fonds se morcellent."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp et Ctrl-PgDn changent d'onglet depuis n'importe où dans ce dialogue ; ← et → le font quand la rangée d'onglets est en surbrillance."
"Save the changes on every tab and close the dialog." = "Enregistre les modifications de tous les onglets et ferme le dialogue."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Ferme le dialogue sans rien enregistrer sur aucun onglet et annule les aperçus en direct."

