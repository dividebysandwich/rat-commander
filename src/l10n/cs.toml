# Settings: the description of the focused setting, tab row, OK and Cancel
"The color theme of the whole interface. Moving through the list previews each one live; Options → Edit themes… changes them or adds your own." = "Barevný motiv celého rozhraní. Při procházení seznamu se každý hned předvede; v nabídce Možnosti → Upravit motivy… je lze upravit nebo přidat vlastní."
"Let a theme's animated color gradients flow. Needs Truecolor. Off keeps them still and saves redraws, which helps over a slow remote connection." = "Nechat animované barevné přechody motivu plynout. Vyžaduje Truecolor. Po vypnutí zůstanou nehybné a ubude překreslování, což pomůže u pomalého vzdáleného připojení."
"Show an icon for each file type in the listings instead of the / * @ markers. Needs a Nerd Font as the terminal's font, or the icons show as boxes." = "Zobrazit u každého typu souboru ikonu místo značek / * @. Terminál musí používat Nerd Font, jinak se ikony zobrazí jako čtverečky."
"Show CPU and memory use at the right end of the menu bar." = "Zobrazit využití CPU a paměti na pravém konci řádku nabídek."
"How long without a key press or mouse movement before the screensaver starts. Off never starts it; Start screensaver in the command palette shows one now." = "Jak dlouho bez stisku klávesy nebo pohybu myši čekat, než se spustí spořič obrazovky. S Off se nespustí nikdy; Spustit spořič obrazovky v paletě příkazů ho spustí hned."
"Which animation the screensaver plays: a starfield, matrix rain, a drifting clock or growing pipes. Random picks a different one each time." = "Jakou animaci spořič přehrává: hvězdné pole, matrixový déšť, plovoucí hodiny nebo rostoucí trubky. Random pokaždé vybere jinou."
"How many columns of file names the Brief view format puts side by side in a panel." = "Kolik sloupců názvů souborů vedle sebe zobrazí Stručné zobrazení v panelu."
"The cell size of the Thumbnails view: Small fits the most pictures on screen, Large shows the most detail." = "Velikost buněk režimu Náhledy: Small vměstná na obrazovku nejvíc obrázků, Large ukáže nejvíc detailů."
"How the 3D view draws a tree: Cubes, shaded boxes hanging on rings, or Spare no expense, an fsn-style landscape with files shaped by type." = "Jak 3D zobrazení kreslí strom: Cubes, stínované kvádry zavěšené na prstencích, nebo Spare no expense, krajina ve stylu fsn se soubory tvarovanými podle typu."
"Re-read a panel by itself when its directory changes on disk, instead of waiting for Ctrl-R. Worth turning off on slow network mounts or huge directories." = "Samočinně znovu načíst panel, když se jeho adresář na disku změní, bez čekání na Ctrl-R. Na pomalých síťových discích nebo u obřích adresářů se vyplatí vypnout."
"Make the 3D view light up directories as files are written in them. It watches every directory in the tree, so turn it off for huge or network-mounted trees." = "Nechat 3D zobrazení rozsvěcovat adresáře, do kterých se zapisují soubory. Sleduje každý adresář stromu, proto u obřích nebo síťově připojených stromů vypněte."
"In a git work tree, the Details view shows a calendar of a year's commits for the selected item. Each one runs git log; turn it off for very large repositories." = "V pracovním stromu gitu ukazuje Podrobné zobrazení kalendář commitů vybrané položky za poslední rok. Každý kalendář spouští git log; u velmi velkých repozitářů vypněte."
"The command F4 edits files with, such as vim or code --wait. Blank uses $VISUAL or $EDITOR. Only used while Use internal editor is off." = "Příkaz, kterým F4 upravuje soubory, např. vim nebo code --wait. Prázdné použije $VISUAL nebo $EDITOR. Platí jen, když je Použít interní editor vypnuto."
"The command F3 views files with, such as less or bat. Blank uses $PAGER. Only used while Use internal viewer is off." = "Příkaz, kterým F3 zobrazuje soubory, např. less nebo bat. Prázdné použije $PAGER. Platí jen, když je Použít interní prohlížeč vypnuto."
"F3 opens Rat Commander's own viewer even when an external viewer is set. It is also used whenever no external viewer is configured." = "F3 otevře vlastní prohlížeč Rat Commanderu, i když je nastaven externí prohlížeč. Použije se také vždy, když žádný externí prohlížeč nastaven není."
"F4 opens Rat Commander's own editor even when an external editor is set. It is also used whenever no external editor is configured." = "F4 otevře vlastní editor Rat Commanderu, i když je nastaven externí editor. Použije se také vždy, když žádný externí editor nastaven není."
"Show the shell command line below the panels. Without it, typing a letter starts a quick search in the active panel. Ctrl-F5 switches it too." = "Zobrazit příkazový řádek shellu pod panely. Bez něj psaní písmen spouští rychlé hledání v aktivním panelu. Přepíná ho také Ctrl-F5."
"The program the command line and Ctrl-O run, such as /bin/zsh or pwsh, without arguments. Blank uses $SHELL (on Windows, the shell rc was started from)." = "Program, který spouští příkazový řádek a Ctrl-O, např. /bin/zsh nebo pwsh, bez argumentů. Prázdné použije $SHELL (ve Windows shell, ze kterého byl rc spuštěn)."
"How many command lines are remembered across sessions, recalled with Alt-P, Alt-N and Alt-H. 0 turns the history off; lowering it drops the oldest at once." = "Kolik příkazů si program pamatuje mezi relacemi (vyvolání přes Alt-P, Alt-N a Alt-H). 0 historii vypne; snížení hodnoty hned zahodí ty nejstarší."
"Ask before F8 deletes the selection or moves it to the trash." = "Zeptat se, než F8 smaže výběr nebo ho přesune do koše."
"Ask what to do when a copy or move meets a file that already exists. Off replaces it without asking." = "Zeptat se, co dělat, když kopírování nebo přesun narazí na již existující soubor. Po vypnutí se soubor přepíše bez ptaní."
"Ask before Enter runs a program or opens a file in its default application." = "Zeptat se, než Enter spustí program nebo otevře soubor ve výchozí aplikaci."
"Ask before the disk manager unmounts a filesystem." = "Zeptat se, než správce disků odpojí souborový systém."
"Ask before F10 quits Rat Commander." = "Zeptat se, než F10 ukončí Rat Commander."
"F8 moves local files to the desktop trash, where they can be restored; Shift-F8 still deletes for good. Off makes F8 delete permanently too." = "F8 přesouvá místní soubory do systémového koše, odkud je lze obnovit; Shift-F8 dál maže natrvalo. Po vypnutí maže natrvalo i F8."
"The language of menus, dialogs and messages, previewed live as you move through the list. Translations are files in the lang folder of the config directory." = "Jazyk nabídek, dialogů a zpráv; při procházení seznamu se hned předvede. Překlady jsou soubory ve složce lang v konfiguračním adresáři."
"Shape and reorder Arabic and Persian text for terminals without bidi support. Turn it off on terminals that do their own, such as mlterm or Konsole." = "Tvarovat a přeuspořádat arabský a perský text pro terminály bez podpory bidi. Vypněte v terminálech, které to zvládají samy, např. mlterm nebo Konsole."
"Pixel graphics for progress bars, graphs, thumbnails and dialog buttons. Auto uses Kitty, Sixel or iTerm2 when the terminal has one; Off draws them in text." = "Pixelová grafika pro ukazatele průběhu, grafy, náhledy a tlačítka dialogů. Auto použije Kitty, Sixel nebo iTerm2, pokud je terminál umí; s Off se kreslí textem."
"Use 24-bit color, which gradients need. Turn it off if colors look wrong: the terminal probably supports only 256 colors." = "Používat 24bitové barvy, které přechody potřebují. Pokud barvy vypadají špatně, vypněte: terminál nejspíš umí jen 256 barev."
"End screen rows with an erase instead of spaces, so text selected with the terminal's mouse copies without trailing blanks. Turn it off if backgrounds break up." = "Ukončovat řádky obrazovky mazáním místo mezer, aby se text označený myší v terminálu kopíroval bez koncových mezer. Vypněte, pokud se rozpadá pozadí."
"Ctrl-PgUp and Ctrl-PgDn switch tabs from anywhere in this dialog; ← and → switch them while the tab row is highlighted." = "Ctrl-PgUp a Ctrl-PgDn přepínají karty odkudkoli v tomto dialogu; ← a → je přepínají, když je zvýrazněný řádek karet."
"Save the changes on every tab and close the dialog." = "Uloží změny na všech kartách a zavře dialog."
"Close the dialog without saving anything on any tab, and undo the live previews." = "Zavře dialog bez uložení čehokoli na kterékoli kartě a vrátí živé náhledy zpět."

