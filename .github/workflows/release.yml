name: Release

# Builds installable archives and native packages for Linux, Windows and macOS.
# Triggers on version tags (v*) to publish a GitHub Release, and can be run
# manually (workflow_dispatch) to produce the artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux (archive + .deb) ----
          # `features` applies to the cross builds only. The Raspberry Pi
          # 32-bit build leaves audio playback out: Debian 13 (and Raspberry Pi
          # OS based on it) moved armhf's ALSA to a 64-bit time_t
          # (`libasound2t64`), which a 32-bit-time_t Rust binary would pass
          # undersized timestamp structs to, so a 32-bit package with playback
          # could be neither safely run nor installed there. Its `.deb` is the
          # `noaudio` variant, without the ALSA dependency.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, kind: linux, deb: true, cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, kind: linux, deb: true, cross: true, features: "--no-default-features --features audio" }   # Raspberry Pi 64-bit
          - { os: ubuntu-latest, target: armv7-unknown-linux-gnueabihf, kind: linux, deb: true, cross: true, features: "--no-default-features", deb_variant: "--variant=noaudio" } # Raspberry Pi 32-bit
          # ---- Windows (archive + .msi) ----
          - { os: windows-latest, target: x86_64-pc-windows-msvc, kind: windows, deb: false, cross: false }
          # ---- macOS (archive + .pkg) ----
          # Both built on Apple Silicon runners (macos-14); the Intel binary is
          # cross-compiled (Apple's toolchain emits both arch slices). This
          # avoids the scarce/retiring Intel `macos-13` runners.
          - { os: macos-14, target: x86_64-apple-darwin, kind: macos, deb: false, cross: false }   # Intel (cross-compiled)
          - { os: macos-14, target: aarch64-apple-darwin, kind: macos, deb: false, cross: false }  # Apple Silicon

    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Version: $VER"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install cargo-deb
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      # ---- Build ----
      # Audio playback links ALSA on Linux. The native Linux job needs its
      # headers; the cross images get the target's from Cross.toml.
      - name: Install ALSA headers
        if: matrix.kind == 'linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # RAR support pulls in the C++ `unrar` library, whose vendored source does
      # not compile with the older C++ toolchain in the arm cross images, so the
      # default features are switched off for the cross targets (SQLite goes
      # with RAR: it needs a C toolchain too), and audio playback is switched
      # back on where the matrix says so. pkg-config refuses to look for a
      # foreign target's ALSA unless told that is intended, and where that
      # target's .pc files are; Cross.toml installs them and passes these in.
      - name: Build (cross)
        if: matrix.cross
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: cross build --locked --release ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      # ---- Archives ----
      - name: Package archive (Unix)
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/rc" staging/
          # `rcedit` shim → `rc` (start in the editor); rc detects its own name.
          ln -sf rc staging/rcedit
          cp README.md staging/ 2>/dev/null || true
          tar -C staging -czf "dist/rc-${VERSION}-${{ matrix.target }}.tar.gz" .

      - name: Package archive (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/rc.exe", "README.md", "packaging/windows/rcedit.cmd", "packaging/windows/portable" `
            -DestinationPath "dist/rc-$env:VERSION-${{ matrix.target }}.zip" -Force

      # ---- Debian packages (amd64 / arm64 / armhf) ----
      - name: Build .deb
        if: matrix.deb
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} ${{ matrix.deb_variant }} --output "dist/"

      # ---- Windows MSI (WiX) ----
      - name: Build MSI
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          $bin = "target/${{ matrix.target }}/release"
          wix build packaging/windows/rc.wxs -d Version=$env:VERSION -d BinDir=$bin `
            -o "dist/rc-$env:VERSION-${{ matrix.target }}.msi"

      # ---- macOS .pkg ----
      - name: Build .pkg
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          mkdir -p pkgroot
          cp "target/${{ matrix.target }}/release/rc" pkgroot/
          # `rcedit` shim → `rc` (start in the editor); rc detects its own name.
          ln -sf rc pkgroot/rcedit
          pkgbuild --identifier com.rat-commander.rc \
            --version "${VERSION}" \
            --install-location /usr/local/bin \
            --root pkgroot \
            "dist/rc-${VERSION}-${{ matrix.target }}.pkg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
